<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — PreOrder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-background text-foreground antialiased min-h-screen relative overflow-x-clip">
  <!-- Exact Ambient Background -->
  <div class="pointer-events-none fixed inset-0 -z-10">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_12%_18%,rgba(255,170,65,0.12),transparent_28%),radial-gradient(circle_at_86%_24%,rgba(255,170,65,0.09),transparent_26%),radial-gradient(circle_at_50%_86%,rgba(77,116,255,0.08),transparent_34%)]"></div>
    <div class="absolute inset-0 opacity-[0.07]" style="background-image: linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px); background-size: 44px 44px;"></div>
  </div>

  <div id="navbar-root"></div>

  <div class="min-h-screen">
    <!-- List View -->
    <div id="orders-list-view" class="mx-auto max-w-5xl space-y-6 p-4 sm:p-6 text-left">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-foreground">My orders</h1>
        <p class="text-sm text-muted-foreground">Track and manage your pre-orders.</p>
      </div>

      <!-- Filter Tabs -->
      <div class="w-full">
        <div id="tabs-bar" class="flex flex-wrap h-auto p-1 bg-muted rounded-xl gap-1">
          <button onclick="setFilter('all')" data-tab="all" class="rounded-lg text-xs py-1.5 px-3 font-medium transition-all bg-background text-foreground shadow">All</button>
          <button onclick="setFilter('pending')" data-tab="pending" class="rounded-lg text-xs py-1.5 px-3 font-medium transition-all text-muted-foreground hover:text-foreground">Pending</button>
          <button onclick="setFilter('preparing')" data-tab="preparing" class="rounded-lg text-xs py-1.5 px-3 font-medium transition-all text-muted-foreground hover:text-foreground">Preparing</button>
          <button onclick="setFilter('ready')" data-tab="ready" class="rounded-lg text-xs py-1.5 px-3 font-medium transition-all text-muted-foreground hover:text-foreground">Ready</button>
          <button onclick="setFilter('completed')" data-tab="completed" class="rounded-lg text-xs py-1.5 px-3 font-medium transition-all text-muted-foreground hover:text-foreground">Completed</button>
          <button onclick="setFilter('cancelled')" data-tab="cancelled" class="rounded-lg text-xs py-1.5 px-3 font-medium transition-all text-muted-foreground hover:text-foreground">Cancelled</button>
        </div>
      </div>

      <div id="orders-loading" class="h-32 w-full rounded-2xl bg-muted/40 animate-pulse flex items-center justify-center text-xs text-muted-foreground">Loading orders...</div>

      <div id="orders-container" class="space-y-3"></div>
    </div>

    <!-- Single Order Ticket Detail View -->
    <div id="order-detail-view" class="mx-auto max-w-2xl px-4 py-8 text-left hidden">
      <button onclick="closeOrderDetail()" class="mb-4 inline-flex items-center text-xs font-semibold text-muted-foreground hover:text-foreground gap-1 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="m15 18-6-6 6-6"/></svg>
        Back to My Orders
      </button>

      <div class="rounded-2xl border border-border/80 bg-card text-card-foreground shadow-sm overflow-hidden">
        <div class="p-6 space-y-4">
          <div class="flex justify-between items-center border-b border-border/60 pb-4">
            <div>
              <p class="text-[10px] uppercase font-bold text-muted-foreground">Order Reference ID</p>
              <h2 id="detail-order-id" class="font-mono text-xs font-bold text-foreground"></h2>
            </div>
            <div id="detail-status-pill" class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-bold uppercase">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span id="detail-status-text"></span>
            </div>
          </div>

          <div class="space-y-2">
            <p class="text-xs font-bold text-foreground">Items Ordered</p>
            <div id="detail-items-box" class="divide-y divide-border/40 rounded-xl border border-border/60 bg-muted/20 px-3.5 py-1"></div>
          </div>

          <div class="space-y-1.5 border-t border-border/60 pt-3 text-xs">
            <div class="flex justify-between text-muted-foreground">
              <span>Total Bill</span>
              <span id="detail-total-bill" class="font-medium text-foreground"></span>
            </div>
            <div class="flex justify-between text-muted-foreground">
              <span>Payment Status</span>
              <span id="detail-payment-status" class="font-bold text-emerald-600 uppercase"></span>
            </div>
          </div>

          <!-- Customer Order Cancellation Action Module -->
          <div id="detail-action-module"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Cancellation Modal -->
  <div id="cancel-reason-modal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 hidden animate-in fade-in-0 duration-200">
    <div class="w-full max-w-md rounded-2xl border border-border bg-card p-6 shadow-2xl text-left space-y-4 animate-in zoom-in-95 duration-200">
      <div>
        <h3 class="text-sm font-black tracking-tight text-foreground">Specify Cancellation Reason</h3>
        <p id="cancel-chances-hint" class="text-xs text-muted-foreground pt-1">
          Let the store manager know why you need to drop this order.
        </p>
      </div>

      <div class="py-1">
        <textarea id="cancellation-reason-text" placeholder="e.g., Selected wrong delivery coordinates / Mistaken duplicate selection..." class="flex min-h-[90px] w-full rounded-xl border border-input bg-background px-3 py-2 text-xs shadow-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary resize-none" maxlength="250"></textarea>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2">
        <button type="button" onclick="closeCancelModal()" class="inline-flex items-center justify-center h-9 px-4 text-xs font-semibold rounded-xl hover:bg-accent text-foreground">Back</button>
        <button id="submit-cancel-request-btn" type="button" onclick="submitCancelRequest()" class="inline-flex items-center justify-center h-9 px-4 bg-destructive text-destructive-foreground font-semibold text-xs rounded-xl shadow-sm hover:bg-destructive/90 transition-all">Submit Request</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    let allOrders = [];
    let currentFilter = "all";
    let activeOrderDetail = null;

    const STATUS_BADGE_STYLES = {
      pending: "bg-amber-500/10 text-amber-500 border-amber-500/20",
      accepted: "bg-blue-500/10 text-blue-500 border-blue-500/20",
      preparing: "bg-indigo-500/10 text-indigo-500 border-indigo-500/20",
      ready: "bg-purple-500/10 text-purple-500 border-purple-500/20",
      completed: "bg-emerald-500/10 text-emerald-500 border-emerald-500/20 font-bold",
      cancel_requested: "bg-rose-500/10 text-rose-500 border-rose-500/20 font-bold animate-pulse",
      cancelled: "bg-red-600/10 text-red-600 border-red-600/30 font-bold",
      refunded: "bg-red-600/10 text-red-600 border-red-600/30 font-bold",
    };

    function renderStatusBadge(status) {
      const s = (status || "pending").toLowerCase();
      const style = STATUS_BADGE_STYLES[s] || "bg-muted text-muted-foreground border-transparent";
      return `
        <span class="inline-flex items-center rounded border px-2 py-0.5 text-[10px] font-bold tracking-wide uppercase ${style}">
          ${s.replace("_", " ")}
        </span>
      `;
    }

    async function loadOrders() {
      const user = window.auth.getUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      try {
        allOrders = await window.api.orders.list({ page: 1, page_size: 50 });
        if (!Array.isArray(allOrders)) allOrders = [];
        document.getElementById("orders-loading").classList.add("hidden");

        const urlParams = new URLSearchParams(window.location.search);
        const orderIdParam = urlParams.get("id");
        if (orderIdParam) {
          showOrderDetail(orderIdParam);
        } else {
          renderOrdersList();
        }
      } catch (err) {
        document.getElementById("orders-loading").textContent = "Failed to load orders: " + err.message;
      }
    }

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll("#tabs-bar button").forEach((btn) => {
        if (btn.getAttribute("data-tab") === f) {
          btn.className = "rounded-lg text-xs py-1.5 px-3 font-medium transition-all bg-background text-foreground shadow";
        } else {
          btn.className = "rounded-lg text-xs py-1.5 px-3 font-medium transition-all text-muted-foreground hover:text-foreground";
        }
      });
      renderOrdersList();
    }

    function renderOrdersList() {
      const container = document.getElementById("orders-container");
      container.innerHTML = "";

      const visible = allOrders.filter((o) => {
        if (!o || !o.status) return false;
        const s = String(o.status).toLowerCase();
        if (currentFilter === "all") return true;
        if (currentFilter === "cancelled") return s === "cancelled" || s === "cancel_requested" || s === "refunded";
        return s === currentFilter;
      });

      if (visible.length === 0) {
        container.innerHTML = `
          <div class="rounded-2xl border border-dashed p-16 text-center text-muted-foreground text-sm">
            No orders found matching this status window.
          </div>
        `;
        return;
      }

      container.innerHTML = visible.map((o) => {
        const s = String(o.status || "").toLowerCase();
        const orderNum = o.order_number ?? (o.id ? String(o.id).slice(0, 8).toUpperCase() : "");
        return `
          <div onclick="showOrderDetail('${o.id}')" class="block cursor-pointer transition-transform active:scale-[0.995] text-left">
            <div class="rounded-2xl border border-border/80 bg-card text-card-foreground shadow-sm hover:border-primary/40 transition-all p-5 space-y-4">
              <div class="flex items-start justify-between gap-4">
                <div class="space-y-1">
                  <div class="flex items-center gap-2">
                    <span class="font-mono text-xs text-muted-foreground bg-muted px-1.5 py-0.5 rounded border border-border/60 font-bold">
                      #${orderNum}
                    </span>
                    ${renderStatusBadge(o.status)}
                  </div>
                  <p class="text-[11px] text-muted-foreground font-mono">
                    ${formatDate(o.created_at)}
                  </p>
                </div>
                <div class="text-right">
                  <p class="text-base font-bold text-foreground">${formatCurrency(o.total_price)}</p>
                  ${o.shop_name ? `<p class="text-xs text-muted-foreground font-medium mt-0.5">${o.shop_name}</p>` : ""}
                </div>
              </div>

              <div class="bg-muted/40 border border-border/40 rounded-xl p-3 text-xs space-y-2">
                <div class="flex items-center justify-between text-[10px] text-muted-foreground border-b border-border/40 pb-1.5 mb-1.5 font-medium uppercase tracking-wider">
                  <span>Order Activity Context</span>
                  <span class="font-semibold text-foreground normal-case font-mono">
                    ${s === 'cancel_requested' ? 'Cancellation Pending Review' : 'Active Fulfillment Workflow'}
                  </span>
                </div>
                ${o.items && o.items.length > 0 ? `
                  <div class="space-y-1.5 divide-y divide-border/20">
                    ${o.items.map((it) => `
                      <div class="flex items-center justify-between pt-1.5 first:pt-0 gap-4 text-left">
                        <span class="font-semibold text-foreground">${it.item_name_snapshot || it.name} ${it.variant_name_snapshot ? `(${it.variant_name_snapshot})` : ''}</span>
                        <span class="font-mono text-xs text-muted-foreground bg-background px-1.5 py-0.5 rounded border shrink-0 font-bold">×${it.quantity}</span>
                      </div>
                    `).join("")}
                  </div>
                ` : `<p class="text-muted-foreground italic">Standard Basket Content</p>`}
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    async function showOrderDetail(orderId) {
      try {
        const order = await window.api.orders.get(orderId);
        activeOrderDetail = order;

        document.getElementById("orders-list-view").classList.add("hidden");
        document.getElementById("order-detail-view").classList.remove("hidden");

        document.getElementById("detail-order-id").textContent = order.id;
        document.getElementById("detail-status-text").textContent = (order.status || "").replace("_", " ");
        document.getElementById("detail-status-pill").className = `inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-bold uppercase ${STATUS_BADGE_STYLES[order.status] || 'bg-primary/10 text-primary'}`;
        document.getElementById("detail-total-bill").textContent = formatCurrency(order.total_price);
        document.getElementById("detail-payment-status").textContent = order.payment_status || "PAID";

        const itemsBox = document.getElementById("detail-items-box");
        itemsBox.innerHTML = (order.items || []).map((it) => `
          <div class="flex justify-between items-center py-2.5 text-xs">
            <span class="text-foreground">${it.quantity} × ${it.item_name_snapshot || it.name}</span>
            <span class="font-medium text-foreground">${formatCurrency(it.unit_price * it.quantity)}</span>
          </div>
        `).join("");

        renderActionModule(order);
      } catch (err) {
        window.toast.error("Failed to load order: " + err.message);
      }
    }

    function closeOrderDetail() {
      activeOrderDetail = null;
      document.getElementById("order-detail-view").classList.add("hidden");
      document.getElementById("orders-list-view").classList.remove("hidden");
      window.history.replaceState(null, "", "orders.html");
      loadOrders();
    }

    function renderActionModule(order) {
      const container = document.getElementById("detail-action-module");
      const s = String(order.status || "").toLowerCase();
      const requestsCount = parseInt(order.cancellation_requests_sent || 0, 10);
      const isPending = s === "pending";
      const isCancellationPending = s === "cancel_requested" || !!order.is_cancellation_pending;
      const isCancelled = s === "cancelled" || s === "refunded";
      const isCompleted = s === "completed";

      if (isCancelled || isCompleted) {
        container.innerHTML = "";
        return;
      }

      if (requestsCount >= 3 && !isCancellationPending) {
        container.innerHTML = `
          <div class="mt-5 pt-4 border-t border-border/80 space-y-2 text-left animate-in fade-in duration-200">
            <div class="text-xs font-semibold text-foreground flex items-center gap-1.5">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5 text-muted-foreground"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <span>Cancellation Limit Exceeded</span>
            </div>
            <p class="text-[11px] text-muted-foreground leading-normal">
              The automated cancellation request threshold has been met. Please connect directly with the shop owner for any additional manual overrides.
            </p>
          </div>
        `;
        return;
      }

      if (isCancellationPending) {
        container.innerHTML = `
          <div class="mt-4 p-4 border border-amber-500/20 bg-amber-500/5 rounded-xl space-y-2 text-left animate-in fade-in duration-200">
            <div class="text-xs font-bold text-amber-500 flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5 animate-spin"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
              <span>Waiting for shop owner reply...</span>
            </div>
            <p class="text-[11px] text-muted-foreground leading-relaxed">
              Your request has been submitted. The kitchen workflow line has been locked automatically. The store operator must explicitly accept or decline this cancellation before this order can be processed.
            </p>
            <div class="text-[10px] text-muted-foreground/70 font-medium pt-1">
              Request attempts used: (${requestsCount} of 3 attempts)
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="mt-4 p-4 border border-border bg-muted/30 rounded-xl flex flex-col sm:flex-row items-center justify-between gap-4">
          <div class="space-y-1 text-left">
            <p class="text-xs font-bold flex items-center gap-1.5 text-foreground">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 text-destructive"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              Manage Order Cancellation
            </p>
            <p class="text-[11px] text-muted-foreground max-w-md leading-normal">
              ${isPending ? 'This order is pending kitchen verification. You can cancel it for an immediate full refund.' : `Active kitchen workflow item. Request attempts used: (${requestsCount} of 3 attempts).`}
            </p>
          </div>
          ${isPending ? `
            <button onclick="instantCancelOrder('${order.id}')" class="inline-flex items-center justify-center whitespace-nowrap rounded-xl bg-destructive text-destructive-foreground shadow hover:bg-destructive/90 text-xs font-semibold gap-1.5 shrink-0 px-4 h-9">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
              Cancel Order
            </button>
          ` : `
            <button onclick="openCancelModal()" class="inline-flex items-center justify-center whitespace-nowrap rounded-xl border border-destructive/20 text-destructive bg-transparent hover:bg-destructive/10 text-xs font-medium gap-1.5 shrink-0 px-4 h-9">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              Request Cancellation
            </button>
          `}
        </div>
      `;
    }

    async function instantCancelOrder(orderId) {
      try {
        await window.api.orders.updateStatus(orderId, "cancelled");
        window.toast.success("Order cancelled successfully.");
        showOrderDetail(orderId);
      } catch (err) {
        window.toast.error("Failed to cancel order: " + err.message);
      }
    }

    function openCancelModal() {
      const requestsCount = parseInt(activeOrderDetail?.cancellation_requests_sent || 0, 10);
      document.getElementById("cancel-chances-hint").textContent = `Remaining requests: ${3 - requestsCount} execution chances left.`;
      document.getElementById("cancellation-reason-text").value = "";
      document.getElementById("cancel-reason-modal").classList.remove("hidden");
    }

    function closeCancelModal() {
      document.getElementById("cancel-reason-modal").classList.add("hidden");
    }

    async function submitCancelRequest() {
      const reason = document.getElementById("cancellation-reason-text").value.trim();
      if (!reason) {
        window.toast.error("Please enter a cancellation reason.");
        return;
      }
      const btn = document.getElementById("submit-cancel-request-btn");
      btn.disabled = true;
      btn.textContent = "Submitting…";

      try {
        await window.api.orders.updateStatus(activeOrderDetail.id, "cancel_requested", reason);
        window.toast.success("Cancellation request submitted to shop owner.");
        closeCancelModal();
        showOrderDetail(activeOrderDetail.id);
      } catch (err) {
        window.toast.error(err.message || "Something went wrong");
        btn.disabled = false;
        btn.textContent = "Submit Request";
      }
    }

    document.addEventListener("DOMContentLoaded", loadOrders);
  </script>
</body>
</html>
