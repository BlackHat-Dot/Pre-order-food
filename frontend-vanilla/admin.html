<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Center — PreOrder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-background text-foreground antialiased min-h-screen relative overflow-x-clip">
  <!-- Exact Ambient Background -->
  <div class="pointer-events-none fixed inset-0 -z-10">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_12%_18%,rgba(255,170,65,0.12),transparent_28%),radial-gradient(circle_at_86%_24%,rgba(255,170,65,0.09),transparent_26%),radial-gradient(circle_at_50%_86%,rgba(77,116,255,0.08),transparent_34%)]"></div>
    <div class="absolute inset-0 opacity-[0.07]" style="background-image: linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px); background-size: 44px 44px;"></div>
  </div>

  <div id="navbar-root"></div>

  <div class="min-h-screen">
    <div class="mx-auto max-w-6xl space-y-6 px-4 py-8 sm:px-6 text-left">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-foreground">Command Center</h1>
        <p class="text-sm text-muted-foreground">System telemetry, platform governance, and merchant audits.</p>
      </div>

      <!-- Stat Cards Grid -->
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <!-- Users Stat -->
        <div class="relative overflow-hidden rounded-xl border border-border/60 bg-card p-5 text-card-foreground shadow-sm">
          <div class="flex items-start justify-between">
            <div class="space-y-1">
              <p class="text-xs font-medium text-muted-foreground uppercase tracking-wider">Registered Accounts</p>
              <p id="stat-users-count" class="text-2xl font-bold tracking-tight text-foreground">--</p>
              <p class="text-xs text-muted-foreground">Platform-wide profiles</p>
            </div>
            <div class="grid h-10 w-10 place-items-center rounded-xl bg-primary/10 text-primary">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
          </div>
          <div class="pointer-events-none absolute inset-x-0 bottom-0 h-0.5" style="background: var(--gradient-primary);"></div>
        </div>

        <!-- Shops Stat -->
        <div class="relative overflow-hidden rounded-xl border border-border/60 bg-card p-5 text-card-foreground shadow-sm">
          <div class="flex items-start justify-between">
            <div class="space-y-1">
              <p class="text-xs font-medium text-muted-foreground uppercase tracking-wider">Total Merchants</p>
              <p id="stat-shops-count" class="text-2xl font-bold tracking-tight text-foreground">--</p>
              <p class="text-xs text-muted-foreground">Registered restaurants</p>
            </div>
            <div class="grid h-10 w-10 place-items-center rounded-xl bg-primary/10 text-primary">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/></svg>
            </div>
          </div>
          <div class="pointer-events-none absolute inset-x-0 bottom-0 h-0.5" style="background: var(--gradient-primary);"></div>
        </div>

        <!-- System Status -->
        <div class="relative overflow-hidden rounded-xl border border-border/60 bg-card p-5 text-card-foreground shadow-sm">
          <div class="flex items-start justify-between">
            <div class="space-y-1">
              <p class="text-xs font-medium text-muted-foreground uppercase tracking-wider">Cluster Telemetry</p>
              <p class="text-2xl font-bold tracking-tight text-emerald-500">100% Operational</p>
              <p class="text-xs text-muted-foreground">Database & Auth verified</p>
            </div>
            <div class="grid h-10 w-10 place-items-center rounded-xl bg-emerald-500/10 text-emerald-500">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
          </div>
          <div class="pointer-events-none absolute inset-x-0 bottom-0 h-0.5 bg-emerald-500"></div>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="inline-flex h-9 items-center justify-center rounded-lg bg-muted p-1 text-muted-foreground">
        <button id="admin-tab-users" onclick="switchAdminTab('users')" class="inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all bg-background text-foreground shadow">Users</button>
        <button id="admin-tab-shops" onclick="switchAdminTab('shops')" class="inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all text-muted-foreground">Merchants</button>
      </div>

      <!-- Users Tab Content -->
      <div id="admin-users-view" class="space-y-3">
        <div class="rounded-xl border border-border/60 bg-card overflow-hidden shadow-sm">
          <div class="p-4 border-b border-border/40 font-semibold text-sm">System Users Directory</div>
          <div id="users-table-container" class="divide-y divide-border/40"></div>
        </div>
      </div>

      <!-- Shops Tab Content -->
      <div id="admin-shops-view" class="space-y-3 hidden">
        <div class="rounded-xl border border-border/60 bg-card overflow-hidden shadow-sm">
          <div class="p-4 border-b border-border/40 font-semibold text-sm">Platform Merchants & Verification</div>
          <div id="shops-table-container" class="divide-y divide-border/40"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    let usersList = [];
    let shopsList = [];

    async function initAdmin() {
      const user = window.auth.getUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      if (user.role !== "admin") {
        window.toast.error("Administrator credentials required.");
        setTimeout(() => window.location.href = "index.html", 1500);
        return;
      }

      loadTelemetry();
      loadUsers();
      loadShops();
    }

    async function loadTelemetry() {
      try {
        const uCount = await window.api.admin.countUsers();
        document.getElementById("stat-users-count").textContent = uCount?.count ?? "--";
      } catch {}

      try {
        const sCount = await window.api.admin.countShops();
        document.getElementById("stat-shops-count").textContent = sCount?.count ?? "--";
      } catch {}
    }

    async function loadUsers() {
      try {
        usersList = await window.api.admin.listUsers();
        if (!Array.isArray(usersList)) usersList = [];
        renderUsers();
      } catch (err) {
        document.getElementById("users-table-container").innerHTML = `<p class="p-6 text-xs text-muted-foreground">Unable to load users.</p>`;
      }
    }

    function renderUsers() {
      const c = document.getElementById("users-table-container");
      if (!usersList || usersList.length === 0) {
        c.innerHTML = `<p class="p-6 text-xs text-muted-foreground text-center">No users found.</p>`;
        return;
      }

      c.innerHTML = usersList.map((u) => `
        <div class="flex items-center justify-between p-4 text-xs">
          <div class="space-y-0.5">
            <p class="font-bold text-foreground">${u.name}</p>
            <p class="text-muted-foreground font-mono">${u.phone || u.email || '—'}</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="rounded bg-muted px-2 py-0.5 font-bold uppercase text-[10px] text-primary">${u.role}</span>
            <span class="rounded px-2 py-0.5 text-[10px] font-semibold ${u.is_active ? 'bg-emerald-500/10 text-emerald-500' : 'bg-destructive/10 text-destructive'}">
              ${u.is_active ? 'Active' : 'Inactive'}
            </span>
          </div>
        </div>
      `).join("");
    }

    async function loadShops() {
      try {
        shopsList = await window.api.admin.listShops();
        if (!Array.isArray(shopsList)) shopsList = [];
        renderShops();
      } catch {
        document.getElementById("shops-table-container").innerHTML = `<p class="p-6 text-xs text-muted-foreground">Unable to load shops.</p>`;
      }
    }

    function renderShops() {
      const c = document.getElementById("shops-table-container");
      if (!shopsList || shopsList.length === 0) {
        c.innerHTML = `<p class="p-6 text-xs text-muted-foreground text-center">No shops found.</p>`;
        return;
      }

      c.innerHTML = shopsList.map((s) => `
        <div class="flex items-center justify-between p-4 text-xs">
          <div class="space-y-0.5">
            <div class="flex items-center gap-2">
              <p class="font-bold text-foreground">${s.name}</p>
              ${s.is_verified ? `
                <span class="text-primary text-[10px] font-semibold bg-primary/10 px-1.5 py-0.5 rounded border border-primary/20">Verified</span>
              ` : `
                <span class="text-muted-foreground text-[10px] bg-muted px-1.5 py-0.5 rounded">Unverified</span>
              `}
            </div>
            <p class="text-muted-foreground">${s.cuisine || '—'} · ${s.phone || '—'}</p>
          </div>
          <div class="flex items-center gap-2">
            ${!s.is_verified ? `
              <button onclick="verifyShop('${s.id}')" class="h-7 px-3 rounded-lg bg-primary text-primary-foreground text-xs font-semibold hover:bg-primary/90 transition-colors">
                Verify Shop
              </button>
            ` : ""}
            <span class="rounded border px-2 py-0.5 text-[10px] font-semibold ${s.is_open ? 'border-primary text-primary' : 'border-border text-muted-foreground'}">
              ${s.is_open ? 'Open' : 'Closed'}
            </span>
          </div>
        </div>
      `).join("");
    }

    async function verifyShop(shopId) {
      try {
        await window.api.admin.verifyShop(shopId);
        window.toast.success("Shop verified successfully!");
        loadShops();
      } catch (err) {
        window.toast.error("Failed to verify shop: " + err.message);
      }
    }

    function switchAdminTab(t) {
      const uBtn = document.getElementById("admin-tab-users");
      const sBtn = document.getElementById("admin-tab-shops");
      const uView = document.getElementById("admin-users-view");
      const sView = document.getElementById("admin-shops-view");

      if (t === "users") {
        uBtn.className = "inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all bg-background text-foreground shadow";
        sBtn.className = "inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all text-muted-foreground";
        uView.classList.remove("hidden");
        sView.classList.add("hidden");
      } else {
        sBtn.className = "inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all bg-background text-foreground shadow";
        uBtn.className = "inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all text-muted-foreground";
        sView.classList.remove("hidden");
        uView.classList.add("hidden");
      }
    }

    document.addEventListener("DOMContentLoaded", initAdmin);
  </script>
</body>
</html>
