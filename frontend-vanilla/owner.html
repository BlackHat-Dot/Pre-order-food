<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Portal — PreOrder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-background text-foreground antialiased min-h-screen relative overflow-x-clip">
  <!-- Exact Ambient Background -->
  <div class="pointer-events-none fixed inset-0 -z-10">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_12%_18%,rgba(255,170,65,0.12),transparent_28%),radial-gradient(circle_at_86%_24%,rgba(255,170,65,0.09),transparent_26%),radial-gradient(circle_at_50%_86%,rgba(77,116,255,0.08),transparent_34%)]"></div>
    <div class="absolute inset-0 opacity-[0.07]" style="background-image: linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px); background-size: 44px 44px;"></div>
  </div>

  <div id="navbar-root"></div>

  <div class="min-h-screen">
    <!-- VIEW 1: MY SHOPS LIST -->
    <div id="owner-shops-list-view" class="mx-auto max-w-6xl space-y-6 px-4 py-8 sm:px-6 text-left">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-foreground">My shops</h1>
          <p class="text-sm text-muted-foreground">Manage your shops and menus.</p>
        </div>
        <button onclick="showCreateShopModal()" class="inline-flex items-center justify-center whitespace-nowrap rounded-xl bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2 text-sm font-semibold transition-colors gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          New shop
        </button>
      </div>

      <div id="shops-loading" class="h-32 w-full rounded-2xl bg-muted/40 animate-pulse flex items-center justify-center text-xs text-muted-foreground">Loading shops...</div>

      <div id="shops-grid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </div>

    <!-- VIEW 2: MANAGE SINGLE SHOP -->
    <div id="owner-shop-manage-view" class="mx-auto max-w-6xl space-y-6 px-4 py-8 sm:px-6 text-left hidden">
      <div class="flex flex-wrap items-center justify-between gap-4 border-b border-border/60 pb-4">
        <div>
          <button onclick="closeShopManager()" class="mb-2 inline-flex items-center text-xs font-semibold text-muted-foreground hover:text-foreground gap-1 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5"><path d="m15 18-6-6 6-6"/></svg>
            Back to my shops
          </button>
          <div class="flex items-center gap-2">
            <h1 id="manage-shop-name" class="text-2xl font-bold tracking-tight text-foreground">Shop</h1>
            <span id="manage-shop-verified" class="hidden">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-primary"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
            </span>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <label class="flex items-center gap-2 text-xs font-semibold text-muted-foreground cursor-pointer">
            <input id="toggle-shop-open" type="checkbox" onchange="toggleShopOpen(this.checked)" class="rounded text-primary focus:ring-primary h-4 w-4" />
            <span id="toggle-shop-open-text">Store Accepting Orders</span>
          </label>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="inline-flex h-9 items-center justify-center rounded-lg bg-muted p-1 text-muted-foreground">
        <button id="shop-tab-orders" onclick="switchShopTab('orders')" class="inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all bg-background text-foreground shadow">Orders</button>
        <button id="shop-tab-menu" onclick="switchShopTab('menu')" class="inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all text-muted-foreground">Menu Items</button>
      </div>

      <!-- TAB CONTENT: LIVE ORDERS -->
      <div id="shop-tab-orders-content" class="space-y-4">
        <div id="owner-orders-container" class="space-y-3"></div>
      </div>

      <!-- TAB CONTENT: MENU ITEMS -->
      <div id="shop-tab-menu-content" class="space-y-4 hidden">
        <div class="flex justify-between items-center">
          <h3 class="text-sm font-semibold uppercase tracking-wider text-muted-foreground">Menu Offerings</h3>
          <button onclick="showAddItemModal()" class="inline-flex items-center justify-center whitespace-nowrap rounded-lg bg-primary text-primary-foreground shadow hover:bg-primary/90 h-8 px-3 text-xs font-semibold gap-1.5 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            Add Menu Item
          </button>
        </div>

        <div id="owner-menu-items-grid" class="grid grid-cols-1 gap-3 sm:grid-cols-2"></div>
      </div>
    </div>
  </div>

  <!-- Create Shop Modal -->
  <div id="create-shop-modal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 hidden animate-in fade-in-0 duration-200">
    <div class="w-full max-w-md rounded-2xl border border-border bg-card p-6 shadow-2xl text-left space-y-4">
      <h3 class="text-base font-bold text-foreground">Create New Shop</h3>
      <form onsubmit="handleCreateShop(event)" class="space-y-3">
        <div>
          <label class="text-xs text-muted-foreground block font-medium">Shop Name</label>
          <input id="create-shop-name" required class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-1 text-xs shadow-sm mt-1 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary" />
        </div>
        <div>
          <label class="text-xs text-muted-foreground block font-medium">Phone</label>
          <input id="create-shop-phone" required class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-1 text-xs shadow-sm mt-1 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary" placeholder="+919876543210" />
        </div>
        <div>
          <label class="text-xs text-muted-foreground block font-medium">Cuisine</label>
          <input id="create-shop-cuisine" class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-1 text-xs shadow-sm mt-1 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary" placeholder="Italian, South Indian, Bakery..." />
        </div>
        <div>
          <label class="text-xs text-muted-foreground block font-medium">Address</label>
          <input id="create-shop-address" required class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-1 text-xs shadow-sm mt-1 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary" placeholder="123 Main St, Area, City" />
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeCreateShopModal()" class="h-8 text-xs px-3 rounded-lg hover:bg-accent">Cancel</button>
          <button type="submit" class="h-8 text-xs font-semibold px-4 rounded-lg bg-primary text-primary-foreground shadow hover:bg-primary/90">Create Shop</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Item Modal -->
  <div id="owner-add-item-modal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 hidden animate-in fade-in-0 duration-200">
    <div class="w-full max-w-md rounded-2xl border border-border bg-card p-6 shadow-2xl text-left space-y-4">
      <h3 class="text-base font-bold text-foreground">Add Menu Item</h3>
      <form onsubmit="handleCreateMenuItem(event)" class="space-y-3">
        <div>
          <label class="text-xs text-muted-foreground block font-medium">Item Name</label>
          <input id="new-item-name" required class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-1 text-xs shadow-sm mt-1 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary" />
        </div>
        <div>
          <label class="text-xs text-muted-foreground block font-medium">Price (₹)</label>
          <input id="new-item-price" type="number" step="0.01" min="0" required class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-1 text-xs shadow-sm mt-1 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary" />
        </div>
        <div>
          <label class="text-xs text-muted-foreground block font-medium">Category</label>
          <input id="new-item-category" placeholder="Starters, Main Course, Drinks..." class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-1 text-xs shadow-sm mt-1 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary" />
        </div>
        <div>
          <label class="text-xs text-muted-foreground block font-medium">Description</label>
          <textarea id="new-item-desc" class="flex min-h-[60px] w-full rounded-md border border-input bg-background px-3 py-1 text-xs shadow-sm mt-1 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary resize-none"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeAddItemModal()" class="h-8 text-xs px-3 rounded-lg hover:bg-accent">Cancel</button>
          <button type="submit" class="h-8 text-xs font-semibold px-4 rounded-lg bg-primary text-primary-foreground shadow hover:bg-primary/90">Add Item</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    let myShops = [];
    let activeShop = null;
    let shopOrders = [];
    let shopMenuItems = [];

    const STATUS_BADGE_STYLES = {
      pending: "bg-amber-500/10 text-amber-500 border-amber-500/20",
      accepted: "bg-blue-500/10 text-blue-500 border-blue-500/20",
      preparing: "bg-indigo-500/10 text-indigo-500 border-indigo-500/20",
      ready: "bg-purple-500/10 text-purple-500 border-purple-500/20",
      completed: "bg-emerald-500/10 text-emerald-500 border-emerald-500/20 font-bold",
      cancel_requested: "bg-rose-500/10 text-rose-500 border-rose-500/20 font-bold animate-pulse",
      cancelled: "bg-red-600/10 text-red-600 border-red-600/30 font-bold",
      refunded: "bg-red-600/10 text-red-600 border-red-600/30 font-bold",
    };

    async function initOwner() {
      const user = window.auth.getUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      if (user.role !== "shop_owner" && user.role !== "admin") {
        window.toast.error("Only Shop Owners and Administrators can access this portal.");
        setTimeout(() => window.location.href = "index.html", 1500);
        return;
      }

      loadMyShops();
    }

    async function loadMyShops() {
      try {
        myShops = await window.api.shops.myShops();
        document.getElementById("shops-loading").classList.add("hidden");
        renderMyShops();
      } catch (err) {
        document.getElementById("shops-loading").textContent = "Failed to load shops: " + err.message;
      }
    }

    function renderMyShops() {
      const grid = document.getElementById("shops-grid");
      if (!myShops || myShops.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full rounded-2xl border border-dashed p-16 text-center text-muted-foreground text-sm">
            You don't have any shops yet. Click "New shop" above to set up your business.
          </div>
        `;
        return;
      }

      grid.innerHTML = myShops.map((s) => `
        <div onclick="openShopManager('${s.id}')" class="cursor-pointer rounded-xl border border-border/80 bg-card text-card-foreground shadow-sm hover:border-primary/40 transition-colors p-5 space-y-2 text-left">
          <div class="flex items-center gap-2">
            <h3 class="font-semibold text-foreground">${s.name}</h3>
            ${s.is_verified ? `
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 text-primary"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
            ` : ""}
          </div>
          <p class="text-xs text-muted-foreground">${s.cuisine || "—"}</p>
          <div class="flex flex-wrap gap-1.5 pt-1">
            <span class="inline-flex items-center rounded-md border px-2 py-0.5 text-xs font-semibold ${s.is_open ? 'bg-primary text-primary-foreground' : 'bg-secondary text-secondary-foreground'}">
              ${s.is_open ? 'Open' : 'Closed'}
            </span>
            <span class="inline-flex items-center rounded-md border px-2 py-0.5 text-xs font-semibold ${s.is_active ? 'border-border text-foreground' : 'border-destructive text-destructive'}">
              ${s.is_active ? 'Active' : 'Inactive'}
            </span>
          </div>
        </div>
      `).join("");
    }

    async function openShopManager(shopId) {
      activeShop = myShops.find((s) => s.id === shopId) || await window.api.shops.get(shopId);

      document.getElementById("owner-shops-list-view").classList.add("hidden");
      document.getElementById("owner-shop-manage-view").classList.remove("hidden");

      document.getElementById("manage-shop-name").textContent = activeShop.name;
      document.getElementById("toggle-shop-open").checked = activeShop.is_open;
      document.getElementById("toggle-shop-open-text").textContent = activeShop.is_open ? "Store Open (Accepting Orders)" : "Store Closed";

      if (activeShop.is_verified) {
        document.getElementById("manage-shop-verified").classList.remove("hidden");
      }

      switchShopTab("orders");
      loadShopOrders();
      loadShopMenu();
    }

    function closeShopManager() {
      activeShop = null;
      document.getElementById("owner-shop-manage-view").classList.add("hidden");
      document.getElementById("owner-shops-list-view").classList.remove("hidden");
      loadMyShops();
    }

    function switchShopTab(tab) {
      const ordersBtn = document.getElementById("shop-tab-orders");
      const menuBtn = document.getElementById("shop-tab-menu");
      const ordersContent = document.getElementById("shop-tab-orders-content");
      const menuContent = document.getElementById("shop-tab-menu-content");

      if (tab === "orders") {
        ordersBtn.className = "inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all bg-background text-foreground shadow";
        menuBtn.className = "inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all text-muted-foreground";
        ordersContent.classList.remove("hidden");
        menuContent.classList.add("hidden");
      } else {
        menuBtn.className = "inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all bg-background text-foreground shadow";
        ordersBtn.className = "inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all text-muted-foreground";
        menuContent.classList.remove("hidden");
        ordersContent.classList.add("hidden");
      }
    }

    async function toggleShopOpen(isOpen) {
      try {
        await window.api.shops.update(activeShop.id, { is_open: isOpen });
        activeShop.is_open = isOpen;
        document.getElementById("toggle-shop-open-text").textContent = isOpen ? "Store Open (Accepting Orders)" : "Store Closed";
        window.toast.success(isOpen ? "Store is now Open." : "Store is now Closed.");
      } catch (err) {
        window.toast.error("Failed to update status: " + err.message);
      }
    }

    async function loadShopOrders() {
      try {
        shopOrders = await window.api.orders.listShopOrders(activeShop.id);
        if (!Array.isArray(shopOrders)) shopOrders = [];
        renderShopOrders();
      } catch {
        shopOrders = [];
        renderShopOrders();
      }
    }

    function renderShopOrders() {
      const container = document.getElementById("owner-orders-container");
      if (!shopOrders || shopOrders.length === 0) {
        container.innerHTML = `
          <div class="rounded-xl border border-dashed p-12 text-center text-muted-foreground text-xs font-medium">
            No live customer orders found for this shop.
          </div>
        `;
        return;
      }

      container.innerHTML = shopOrders.map((o) => {
        const s = String(o.status || "").toLowerCase();
        const badgeStyle = STATUS_BADGE_STYLES[s] || "bg-muted text-muted-foreground";
        return `
          <div class="rounded-xl border border-border/80 bg-card p-5 space-y-4 text-left shadow-sm">
            <div class="flex items-start justify-between gap-4">
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-mono text-xs font-bold text-foreground">#${o.order_number || o.id.slice(0, 8).toUpperCase()}</span>
                  <span class="inline-flex items-center rounded border px-2 py-0.5 text-[10px] font-bold uppercase ${badgeStyle}">
                    ${s.replace("_", " ")}
                  </span>
                </div>
                <p class="text-[11px] text-muted-foreground font-mono mt-1">${formatDate(o.created_at)}</p>
              </div>
              <div class="text-right">
                <p class="text-base font-bold text-foreground">${formatCurrency(o.total_price)}</p>
                <p class="text-xs text-muted-foreground">${(o.payment_status || "paid").toUpperCase()}</p>
              </div>
            </div>

            <!-- Items -->
            <div class="bg-muted/40 border border-border/40 rounded-xl p-3 text-xs space-y-1.5">
              ${(o.items || []).map((it) => `
                <div class="flex justify-between items-center text-xs">
                  <span class="font-medium text-foreground">${it.quantity} × ${it.item_name_snapshot || it.name}</span>
                  <span class="font-mono text-muted-foreground">${formatCurrency(it.unit_price * it.quantity)}</span>
                </div>
              `).join("")}
              ${o.instructions ? `<p class="text-[11px] text-primary italic pt-1 border-t border-border/30">Note: ${o.instructions}</p>` : ""}
            </div>

            <!-- Workflow Action Buttons -->
            <div class="flex flex-wrap items-center justify-end gap-2 pt-2 border-t border-border/40">
              ${s === 'pending' ? `
                <button onclick="updateOrderStatus('${o.id}', 'cancelled')" class="h-8 rounded-lg border border-destructive/20 text-destructive hover:bg-destructive/10 text-xs font-semibold px-3">Decline</button>
                <button onclick="updateOrderStatus('${o.id}', 'accepted')" class="h-8 rounded-lg bg-primary text-primary-foreground hover:bg-primary/90 text-xs font-semibold px-4 shadow">Accept Order</button>
              ` : s === 'accepted' ? `
                <button onclick="updateOrderStatus('${o.id}', 'preparing')" class="h-8 rounded-lg bg-indigo-600 text-white hover:bg-indigo-500 text-xs font-semibold px-4 shadow">Start Preparing</button>
              ` : s === 'preparing' ? `
                <button onclick="updateOrderStatus('${o.id}', 'ready')" class="h-8 rounded-lg bg-purple-600 text-white hover:bg-purple-500 text-xs font-semibold px-4 shadow">Mark Ready</button>
              ` : s === 'ready' ? `
                <button onclick="updateOrderStatus('${o.id}', 'completed')" class="h-8 rounded-lg bg-emerald-600 text-white hover:bg-emerald-500 text-xs font-semibold px-4 shadow">Complete Order</button>
              ` : s === 'cancel_requested' ? `
                <button onclick="updateOrderStatus('${o.id}', 'accepted')" class="h-8 rounded-lg border border-border text-foreground hover:bg-accent text-xs font-semibold px-3">Decline Cancellation</button>
                <button onclick="updateOrderStatus('${o.id}', 'cancelled')" class="h-8 rounded-lg bg-destructive text-destructive-foreground hover:bg-destructive/90 text-xs font-semibold px-4 shadow">Accept & Refund</button>
              ` : `
                <span class="text-xs text-muted-foreground font-medium">Workflow Finished</span>
              `}
            </div>
          </div>
        `;
      }).join("");
    }

    async function updateOrderStatus(orderId, nextStatus) {
      try {
        await window.api.orders.updateStatus(orderId, nextStatus);
        window.toast.success(`Order updated to ${nextStatus}`);
        loadShopOrders();
      } catch (err) {
        window.toast.error("Failed to update order: " + err.message);
      }
    }

    async function loadShopMenu() {
      try {
        shopMenuItems = await window.api.menu.listItems(activeShop.id);
        renderShopMenu();
      } catch {
        shopMenuItems = [];
        renderShopMenu();
      }
    }

    function renderShopMenu() {
      const grid = document.getElementById("owner-menu-items-grid");
      if (!shopMenuItems || shopMenuItems.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full rounded-xl border border-dashed p-12 text-center text-muted-foreground text-xs font-medium">
            No menu items found. Click "Add Menu Item" above to add dishes.
          </div>
        `;
        return;
      }

      grid.innerHTML = shopMenuItems.map((it) => `
        <div class="rounded-xl border border-border/80 bg-card p-4 space-y-2 flex flex-col justify-between text-left shadow-sm">
          <div>
            <div class="flex items-center justify-between">
              <h4 class="font-semibold text-sm text-foreground">${it.name}</h4>
              <span class="font-bold text-primary text-xs">${formatCurrency(it.price)}</span>
            </div>
            ${it.category ? `<span class="inline-block rounded bg-muted px-1.5 py-0.5 text-[10px] text-muted-foreground uppercase font-mono mt-1">${it.category}</span>` : ""}
            ${it.description ? `<p class="text-xs text-muted-foreground line-clamp-2 mt-1">${it.description}</p>` : ""}
          </div>
          <div class="flex items-center justify-end gap-2 pt-2 border-t border-border/40">
            <button onclick="deleteMenuItem('${it.id}')" class="h-7 text-xs px-2 rounded hover:bg-destructive/10 text-destructive transition-colors">
              Delete
            </button>
          </div>
        </div>
      `).join("");
    }

    function showCreateShopModal() {
      document.getElementById("create-shop-modal").classList.remove("hidden");
    }
    function closeCreateShopModal() {
      document.getElementById("create-shop-modal").classList.add("hidden");
    }

    async function handleCreateShop(e) {
      e.preventDefault();
      const name = document.getElementById("create-shop-name").value.trim();
      const phone = document.getElementById("create-shop-phone").value.trim();
      const cuisine = document.getElementById("create-shop-cuisine").value.trim();
      const address = document.getElementById("create-shop-address").value.trim();

      try {
        await window.api.shops.create({ name, phone, cuisine, address });
        window.toast.success("Shop created successfully!");
        closeCreateShopModal();
        loadMyShops();
      } catch (err) {
        window.toast.error("Failed to create shop: " + err.message);
      }
    }

    function showAddItemModal() {
      document.getElementById("owner-add-item-modal").classList.remove("hidden");
    }
    function closeAddItemModal() {
      document.getElementById("owner-add-item-modal").classList.add("hidden");
    }

    async function handleCreateMenuItem(e) {
      e.preventDefault();
      const name = document.getElementById("new-item-name").value.trim();
      const price = parseFloat(document.getElementById("new-item-price").value);
      const category = document.getElementById("new-item-category").value.trim();
      const description = document.getElementById("new-item-desc").value.trim();

      try {
        await window.api.menu.createItem(activeShop.id, { name, price, category, description });
        window.toast.success("Item added to menu.");
        closeAddItemModal();
        document.getElementById("new-item-name").value = "";
        document.getElementById("new-item-price").value = "";
        document.getElementById("new-item-category").value = "";
        document.getElementById("new-item-desc").value = "";
        loadShopMenu();
      } catch (err) {
        window.toast.error("Failed to add menu item: " + err.message);
      }
    }

    async function deleteMenuItem(itemId) {
      if (!confirm("Are you sure you want to delete this menu item?")) return;
      try {
        await window.api.menu.deleteItem(itemId);
        window.toast.success("Item removed.");
        loadShopMenu();
      } catch (err) {
        window.toast.error("Failed to delete item: " + err.message);
      }
    }

    document.addEventListener("DOMContentLoaded", initOwner);
  </script>
</body>
</html>
