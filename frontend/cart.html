<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Order Ticket Manifest — PREORDER</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <!-- Global Architectural Header -->
  <div id="global-header"></div>

  <main class="app-container" style="padding: 48px var(--container-padding) 80px;">
    <div style="margin-bottom: 32px;">
      <div class="eyebrow">DISPATCH ASSEMBLY</div>
      <h1 class="headline-1">Active Ticket Manifest</h1>
      <p class="subheadline">Review selected dishes and variant configurations before proceeding to checkout and scheduling.</p>
    </div>

    <div style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; align-items: start;" id="cart-main-grid">
      <!-- Items List -->
      <div>
        <div style="border: 1px solid var(--border-medium); background: var(--bg-surface); border-radius: var(--radius-sm); padding: 24px;">
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px;">
            <div class="headline-3" id="cart-page-shop">Target Kitchen: —</div>
            <button class="btn btn-ghost btn-sm" id="clear-ticket-btn" style="color: var(--status-danger);">CLEAR TICKET</button>
          </div>

          <div id="cart-page-items" style="display: flex; flex-direction: column; gap: 14px;">
            <!-- Cart items -->
          </div>
        </div>
      </div>

      <!-- Ticket Totals & Dispatch -->
      <aside style="border: 1px solid var(--border-medium); background: var(--bg-surface); border-radius: var(--radius-sm); padding: 28px;">
        <div class="eyebrow">ORDER SUMMARY</div>
        <h2 class="headline-3" style="margin: 4px 0 20px;">Subtotal & Timing</h2>

        <div style="display: flex; flex-direction: column; gap: 12px; font-family: var(--font-mono); font-size: 0.84rem;">
          <div style="display: flex; justify-content: space-between; color: var(--text-secondary);">
            <span>TOTAL ITEMS:</span>
            <span id="cart-page-count" style="color: var(--text-primary); font-weight: 600;">0</span>
          </div>
          <div style="display: flex; justify-content: space-between; color: var(--text-secondary);">
            <span>PEAK PREP DURATION:</span>
            <span id="cart-page-prep" style="color: var(--accent-ember-hover); font-weight: 600;">0 MIN</span>
          </div>
          <div class="hairline-divider" style="margin: 8px 0;"></div>
          <div style="display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: 700; color: var(--text-primary);">
            <span>SUBTOTAL:</span>
            <span id="cart-page-subtotal" style="color: var(--accent-ember-hover);">₹0.00</span>
          </div>
        </div>

        <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 10px;">
          <a href="/checkout.html" class="btn btn-primary btn-lg" id="cart-page-checkout-btn" style="width: 100%; text-align: center;">
            PROCEED TO SETTLEMENT &rarr;
          </a>
          <a href="/index.html" class="btn btn-secondary btn-sm" style="width: 100%; text-align: center;">
            &larr; EXPLORE MORE KITCHENS
          </a>
        </div>
      </aside>
    </div>
  </main>

  <!-- Global Footer -->
  <div id="global-footer"></div>

  <!-- Scripts -->
  <script type="module">
    import { cart } from '/js/cart.js';
    import { formatPrice } from '/js/app.js';
    import { toast } from '/js/toast.js';

    function renderCartPage() {
      const state = cart.getCart();
      const shopTitle = document.getElementById('cart-page-shop');
      const itemsContainer = document.getElementById('cart-page-items');
      const countEl = document.getElementById('cart-page-count');
      const prepEl = document.getElementById('cart-page-prep');
      const subtotalEl = document.getElementById('cart-page-subtotal');
      const checkoutBtn = document.getElementById('cart-page-checkout-btn');

      if (state.items.length === 0) {
        shopTitle.textContent = 'Target Kitchen: None';
        itemsContainer.innerHTML = `
          <div style="padding: 48px; text-align: center; color: var(--text-tertiary); font-family: var(--font-mono);">
            [ ∅ TICKET IS CURRENTLY EMPTY ]
          </div>
        `;
        countEl.textContent = '0';
        prepEl.textContent = '0 MIN';
        subtotalEl.textContent = '₹0.00';
        checkoutBtn.classList.add('disabled');
        return;
      }

      checkoutBtn.classList.remove('disabled');
      shopTitle.textContent = `Target Kitchen: ${state.shopName || 'Partner Outpost'}`;
      countEl.textContent = cart.getItemsCount();
      prepEl.textContent = `${cart.getMaxPrepMinutes()} MIN`;
      subtotalEl.textContent = formatPrice(cart.getSubtotal());

      itemsContainer.innerHTML = state.items.map(item => `
        <div style="border: 1px solid var(--border-subtle); background: var(--bg-surface-elevated); padding: 16px; border-radius: var(--radius-xs); display: flex; justify-content: space-between; align-items: center; gap: 16px;">
          <div>
            <div style="font-weight: 600; font-size: 0.92rem; color: var(--text-primary);">${item.name}</div>
            ${item.variantName ? `<div class="mono-meta" style="color: var(--accent-ember); font-size: 0.72rem;">[ ${item.variantName} ]</div>` : ''}
            <div class="mono-meta" style="font-size: 0.72rem; color: var(--text-tertiary); margin-top: 2px;">
              Unit: ${formatPrice(item.price)} &bull; Prep: ~${item.prepMinutes || 15}M
            </div>
          </div>

          <div style="display: flex; align-items: center; gap: 16px;">
            <div class="qty-stepper">
              <button class="qty-btn" onclick="window.cart.updateQuantity('${item.itemId}', ${item.variantId ? `'${item.variantId}'` : 'null'}, -1)">-</button>
              <span class="qty-val">${item.quantity}</span>
              <button class="qty-btn" onclick="window.cart.updateQuantity('${item.itemId}', ${item.variantId ? `'${item.variantId}'` : 'null'}, 1)">+</button>
            </div>
            <div class="mono-meta" style="font-weight: 700; min-width: 70px; text-align: right;">
              ${formatPrice(item.price * item.quantity)}
            </div>
            <button class="btn btn-ghost btn-sm" onclick="window.cart.removeItem('${item.itemId}', ${item.variantId ? `'${item.variantId}'` : 'null'})" style="color: var(--status-danger); padding: 4px 8px;">
              &times;
            </button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('clear-ticket-btn')?.addEventListener('click', () => {
      if (cart.getItemsCount() === 0) return;
      if (window.confirm('Clear all items from active order ticket?')) {
        cart.clear();
        toast.info('Order ticket cleared');
      }
    });

    cart.subscribe(() => renderCartPage());
    renderCartPage();
  </script>
</body>
</html>
