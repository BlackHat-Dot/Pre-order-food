<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your order — preorder</title>
<link rel="stylesheet" href="/css/system.css">
</head>
<body>
<div id="site-header"></div>
<main class="page"><div class="wrap">
  <div class="page-head"><div><h1 class="h1">Your order</h1><p class="muted" id="shop">Nothing selected yet.</p></div>
    <button class="btn quiet" id="clear">Clear order</button></div>
  <div class="split">
    <ul class="rows" id="items"></ul>
    <aside class="panel aside">
      <h2 class="h2">Summary</h2>
      <dl><div class="kv"><dt>Items</dt><dd class="num" id="n">0</dd></div>
      <div class="kv"><dt>Longest cook time</dt><dd class="num" id="prep">0 min</dd></div>
      <div class="kv total"><dt>Subtotal</dt><dd class="num" id="sub">₹0</dd></div></dl>
      <a class="btn accent lg" id="go" href="/checkout.html" style="width:100%;margin-top:20px">Choose arrival &amp; pay</a>
      <a class="btn quiet" href="/index.html" style="width:100%;margin-top:6px">Add from another kitchen</a>
    </aside>
  </div>
</div></main>
<div id="site-footer"></div>
<script type="module">
import { cart } from '/js/cart.js'; import { toast } from '/js/toast.js'; import { esc, formatPrice } from '/js/shell.js';
const $ = id => document.getElementById(id);
$('items').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const { item, variant, act } = b.dataset, v = variant || null;
  act === 'remove' ? cart.removeItem(item, v) : cart.updateQuantity(item, v, act === 'inc' ? 1 : -1);
});
$('clear').addEventListener('click', () => { if (cart.getItemsCount() && confirm('Remove everything from your order?')) { cart.clear(); toast.info('Order cleared'); } });
cart.subscribe(s => {
  const n = cart.getItemsCount();
  $('shop').textContent = s.shopName ? `From ${s.shopName}` : 'Nothing selected yet.';
  $('n').textContent = n; $('prep').textContent = `${cart.getMaxPrepMinutes()} min`; $('sub').textContent = formatPrice(cart.getSubtotal());
  $('go').classList.toggle('disabled', !n);
  $('items').innerHTML = n ? s.items.map(i => { const d = `data-item="${esc(i.itemId)}" data-variant="${esc(i.variantId || '')}"`; return `
    <li class="row" style="grid-template-columns:1fr auto auto auto;gap:20px">
      <div><strong class="h3" style="font-family:var(--display)">${esc(i.name)}</strong>${i.variantName ? `<div class="small muted">${esc(i.variantName)}</div>` : ''}<div class="small faint">${formatPrice(i.price)} each · about ${i.prepMinutes || 15} min</div></div>
      <div class="step"><button data-act="dec" ${d} aria-label="One less">−</button><span>${i.quantity}</span><button data-act="inc" ${d} ${i.quantity >= 10 ? 'disabled title="Maximum quantity is 10"' : ''} aria-label="One more">+</button></div>
      <strong class="num">${formatPrice(i.price * i.quantity)}</strong>
      <button class="btn quiet sm" data-act="remove" ${d}>Remove</button></li>`; }).join('')
    : `<li class="empty">Your order is empty. <a href="/index.html"><strong>Browse kitchens</strong></a></li>`;
});
</script></body></html>
