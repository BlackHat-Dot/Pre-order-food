<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — preorder</title>
<link rel="stylesheet" href="/css/system.css">
</head>
<body>
<div id="site-header"></div>
<main class="page"><div class="wrap">
  <div class="page-head"><div><h1 class="h1">Checkout</h1><p class="muted">Ordering from <strong id="shop">—</strong></p></div></div>
  <div class="split">
    <div>
      <section class="panel"><h2 class="h3">How will you get it?</h2>
        <div class="grid2">
          <label class="choice" style="margin:0"><span><input type="radio" name="ot" value="table_booking" checked>Pick up at counter</span></label>
          <label class="choice" style="margin:0"><span><input type="radio" name="ot" value="delivery">Delivery</span></label>
        </div>
        <div id="addr" hidden style="margin-top:18px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><label class="small" style="font-weight:600" for="addr-sel">Delivery address</label><button class="btn quiet sm" id="addr-new" type="button">Add address</button></div>
          <select class="input" id="addr-sel"></select>
        </div>
      </section>
      <section class="panel"><h2 class="h3">Note for the kitchen</h2>
        <textarea class="input" id="notes" placeholder="Allergies, spice level, when you'll arrive…"></textarea></section>
      <section class="panel"><h2 class="h3">Payment</h2>
        <label class="choice"><span><input type="radio" name="pm" value="cod" checked>Pay at counter or on delivery</span><span class="faint small">No fee</span></label>
        <label class="choice"><span><input type="radio" name="pm" value="online">UPI or net banking</span></label>
        <label class="choice"><span><input type="radio" name="pm" value="coupon">Voucher from rewards</span></label>
      </section>
    </div>
    <aside class="panel aside">
      <h2 class="h2">Your order</h2>
      <div id="lines"></div>
      <div class="field" style="margin-top:20px"><label for="code">Voucher code</label>
        <div style="display:flex;gap:8px"><input class="input" id="code" placeholder="SHOP-ABC123" style="text-transform:uppercase"><button class="btn line sm" id="apply" type="button">Apply</button></div>
        <div class="fb" id="cfb" hidden></div></div>
      <div class="field"><label for="pts">Use reward points <span class="faint" id="bal" style="font-weight:400"></span></label>
        <div style="display:flex;align-items:center;gap:12px"><input class="input" id="pts" type="number" min="0" value="0" style="width:110px"><span class="small muted num" id="ptsv">= ₹0 off</span></div></div>
      <dl><div class="kv"><dt>Subtotal</dt><dd class="num" id="sub">₹0</dd></div>
      <div class="kv" id="cr" hidden><dt>Voucher</dt><dd class="num" id="cv"></dd></div>
      <div class="kv" id="pr" hidden><dt>Points</dt><dd class="num" id="pv"></dd></div>
      <div class="kv total"><dt>Total</dt><dd class="num" id="tot">₹0</dd></div></dl>
      <button class="btn accent lg" id="send" style="width:100%;margin-top:20px">Place order</button>
    </aside>
  </div>
</div></main>

<dialog id="ad"><form method="dialog">
  <h2 class="h2" style="margin-bottom:18px">New address</h2>
  <div class="field"><label for="a-t">Label</label><input class="input" id="a-t" placeholder="Home, Office…"></div>
  <div class="field"><label for="a-l">Street address</label><input class="input" id="a-l" required></div>
  <div class="field"><label for="a-m">Landmark</label><input class="input" id="a-m"></div>
  <div class="actions"><button class="btn quiet" value="x">Cancel</button><button class="btn accent" id="a-save" value="s">Save address</button></div>
</form></dialog>
<div id="site-footer"></div>
<script type="module">
import { api } from '/js/api.js'; import { auth } from '/js/auth.js'; import { cart } from '/js/cart.js'; import { toast } from '/js/toast.js'; import { esc, formatPrice } from '/js/shell.js';
const $ = id => document.getElementById(id);
if (!auth.requireAuth()) throw 0;
const s = cart.getCart();
if (!s.shopId || !s.items.length) { toast.info('Your order is empty.'); setTimeout(() => location.href = '/index.html', 700); throw 0; }
const RATE = 0.1; let coupon = null, points = 0;
$('shop').textContent = s.shopName || 'this kitchen';
$('lines').innerHTML = s.items.map(i => `<div class="kv"><dt>${i.quantity} × ${esc(i.name)}${i.variantName ? ` (${esc(i.variantName)})` : ''}</dt><dd class="num">${formatPrice(i.price * i.quantity)}</dd></div>`).join('');

function totals() {
  const sub = cart.getSubtotal(), c = coupon ? Number(coupon.discount_value) || 0 : 0, p = Number($('pts').value || 0) * RATE;
  $('sub').textContent = formatPrice(sub);
  $('cr').hidden = !c; $('cv').textContent = `−${formatPrice(c)}`;
  $('pr').hidden = !p; $('pv').textContent = `−${formatPrice(p)}`;
  $('ptsv').textContent = `= ${formatPrice(p)} off`;
  $('tot').textContent = formatPrice(Math.max(0, sub - c - p));
}
$('pts').addEventListener('input', e => { e.target.value = Math.min(Math.max(0, Number(e.target.value) || 0), points); totals(); });
$('apply').addEventListener('click', async () => {
  const code = $('code').value.trim(); if (!code) return toast.info('Enter a voucher code');
  const fb = $('cfb'); fb.hidden = false;
  try { coupon = await api.validateCoupon(code, s.shopId); fb.className = 'fb ok'; fb.textContent = `Voucher applied: ${formatPrice(coupon.discount_value)} off`; }
  catch (e) { coupon = null; fb.className = 'fb bad'; fb.textContent = e.message || "This voucher can't be used at this kitchen"; }
  totals();
});
document.querySelectorAll('input[name=ot]').forEach(r => r.addEventListener('change', e => $('addr').hidden = e.target.value !== 'delivery'));

async function addrs() {
  try {
    const a = await api.getAddresses();
    $('addr-sel').innerHTML = a.length ? a.map(x => `<option value="${esc(x.id)}" ${x.is_default ? 'selected' : ''}>${x.title ? esc(x.title) + ': ' : ''}${esc(x.address_line)}${x.landmark ? ` (${esc(x.landmark)})` : ''}</option>`).join('') : '<option value="">No saved addresses. Add one.</option>';
  } catch { $('addr-sel').innerHTML = '<option value="">Addresses could not be loaded</option>'; }
}
$('addr-new').addEventListener('click', () => $('ad').showModal());
$('a-save').addEventListener('click', async e => {
  const line = $('a-l').value.trim(); if (!line) { e.preventDefault(); return toast.error('Street address is required'); }
  try { await api.createAddress({ title: $('a-t').value.trim(), address_line: line, landmark: $('a-m').value.trim() }); toast.success('Address saved'); addrs(); }
  catch (err) { toast.error(err.message || 'Address could not be saved'); }
});

$('send').addEventListener('click', async () => {
  const b = $('send'), type = document.querySelector('input[name=ot]:checked').value;
  const addr = type === 'delivery' ? $('addr-sel').value : null;
  if (type === 'delivery' && !addr) return toast.error('Choose or add a delivery address');
  b.disabled = true; b.textContent = 'Placing order…';
  try {
    const o = await api.createOrder({
      shop_id: s.shopId, items: s.items.map(i => ({ item_id: i.itemId, variant_id: i.variantId || null, quantity: Math.min(10, Math.max(1, i.quantity)) })),
      order_type: type, payment_method: document.querySelector('input[name=pm]:checked').value,
      instructions: $('notes').value.trim() || null, redeem_loyalty_points: Number($('pts').value || 0),
      coupon_id: coupon ? coupon.id : null, delivery_address_id: addr });
    toast.success(`Order #${o.order_number || o.id.slice(0, 8)} placed`);
    cart.clear(); setTimeout(() => location.href = `/orders.html?id=${o.id}`, 600);
  } catch (err) { toast.error(err.message || 'The order could not be placed'); b.disabled = false; b.textContent = 'Place order'; }
});

totals(); addrs();
api.getLoyaltyAccount(s.shopId).then(l => { points = l.points_balance || 0; $('bal').textContent = `(${points} available)`; $('pts').max = points; }).catch(() => {});
</script></body></html>
