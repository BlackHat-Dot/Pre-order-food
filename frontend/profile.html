<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — PreOrder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-ambient">
    <div class="bg-ambient-gradient"></div>
    <div class="bg-ambient-grid"></div>
  </div>

  <div id="navbar-root"></div>

  <main style="padding: 3rem 0 5rem;">
    <div class="container" style="max-width: 800px;">
      <h1 style="font-size: 2rem; font-weight: 800; letter-spacing: -0.02em;">Account Profile</h1>
      <p style="color: var(--foreground-muted); font-size: 0.875rem; margin-top: 0.25rem;">Manage your credentials and delivery addresses.</p>

      <!-- Profile Form -->
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.75rem; margin-top: 2rem;">
        <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1.25rem;">Personal Details</h3>
        <form id="profile-form">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="prof-name" class="input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address (Read-only)</label>
            <input type="email" id="prof-email" class="input" disabled style="opacity: 0.7;">
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="prof-phone" class="input">
          </div>
          <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
        </form>
      </div>

      <!-- Address Book -->
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.75rem; margin-top: 2rem;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;">
          <h3 style="font-size: 1.15rem; font-weight: 700;">Saved Delivery Addresses</h3>
          <button onclick="toggleAddressForm()" class="btn btn-outline btn-sm">+ Add Address</button>
        </div>

        <form id="new-address-form" style="display: none; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1.5rem;">
          <h4 style="font-size: 0.95rem; font-weight: 700; margin-bottom: 1rem;">Add New Address</h4>
          <div class="form-group">
            <label class="form-label">Street / Apartment / Area</label>
            <input type="text" id="addr-line" class="input" required placeholder="Flat 4B, Hillview Apartments">
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label">City</label>
              <input type="text" id="addr-city" class="input" required placeholder="Bangalore">
            </div>
            <div class="form-group">
              <label class="form-label">Postal Code</label>
              <input type="text" id="addr-postal" class="input" placeholder="560001">
            </div>
          </div>
          <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
            <button type="button" onclick="toggleAddressForm()" class="btn btn-ghost btn-sm">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm">Save Address</button>
          </div>
        </form>

        <div id="addresses-list">
          <!-- Loaded via JS -->
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © 2026 PreOrder. All rights reserved.
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function initProfile() {
      if (!window.auth.isLoggedIn()) {
        window.location.href = "login.html";
        return;
      }

      const user = window.auth.getUser();
      document.getElementById("prof-name").value = user.name || "";
      document.getElementById("prof-email").value = user.email || "";
      document.getElementById("prof-phone").value = user.phone || "";

      loadAddresses();
    }

    async function loadAddresses() {
      const container = document.getElementById("addresses-list");
      try {
        const addresses = await window.api.auth.listAddresses();
        if (!addresses || addresses.length === 0) {
          container.innerHTML = `<p style="color: var(--muted-foreground); font-size: 0.875rem;">No saved addresses yet.</p>`;
          return;
        }

        container.innerHTML = addresses.map(a => `
          <div style="display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.875rem 1rem; margin-bottom: 0.75rem;">
            <div>
              <div style="font-weight: 700; font-size: 0.9rem;">📍 ${a.address_line}</div>
              <div style="color: var(--foreground-muted); font-size: 0.785rem;">${a.city} ${a.postal_code || ''}</div>
            </div>
            <button onclick="deleteAddress('${a.id}')" class="btn btn-ghost btn-sm" style="color: var(--destructive);" title="Delete address">🗑️</button>
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = `<p style="color: var(--destructive); font-size: 0.85rem;">Failed to load addresses.</p>`;
      }
    }

    function toggleAddressForm() {
      const form = document.getElementById("new-address-form");
      form.style.display = form.style.display === "block" ? "none" : "block";
    }

    document.getElementById("profile-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const res = await window.api.auth.updateProfile({
          name: document.getElementById("prof-name").value.trim(),
          phone: document.getElementById("prof-phone").value.trim() || undefined,
        });
        localStorage.setItem("auth_user", JSON.stringify(res));
        showToast("success", "Profile updated!");
      } catch (err) {
        showToast("error", err.message);
      }
    });

    document.getElementById("new-address-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await window.api.auth.createAddress({
          address_line: document.getElementById("addr-line").value.trim(),
          city: document.getElementById("addr-city").value.trim(),
          postal_code: document.getElementById("addr-postal").value.trim() || undefined,
        });
        showToast("success", "Address added!");
        toggleAddressForm();
        loadAddresses();
      } catch (err) {
        showToast("error", err.message);
      }
    });

    async function deleteAddress(id) {
      if (confirm("Delete this address?")) {
        try {
          await window.api.auth.deleteAddress(id);
          showToast("success", "Address deleted.");
          loadAddresses();
        } catch (err) {
          showToast("error", err.message);
        }
      }
    }

    document.addEventListener("DOMContentLoaded", initProfile);
  </script>
</body>
</html>
