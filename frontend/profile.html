<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account — preorder</title>
<link rel="stylesheet" href="/css/system.css">
</head>
<body>
<div id="site-header"></div>
<main class="page"><div class="wrap">
  <div class="page-head"><div><h1 class="h1">Account</h1><p class="muted">Your details, password and saved addresses.</p></div></div>
  <div class="split even">
    <div>
      <section class="panel"><h2 class="h2" id="nm">—</h2>
        <dl><div class="kv"><dt>Phone</dt><dd id="ph"></dd></div><div class="kv"><dt>Account type</dt><dd id="rl"></dd></div></dl>
        <button class="btn line" id="edit" style="margin-top:18px">Edit details</button></section>
      <section class="panel"><h2 class="h3">Change password</h2>
        <form id="pf"><div class="field"><label for="op">Current password</label><input class="input" id="op" type="password" required autocomplete="current-password"></div>
        <div class="field"><label for="np">New password</label><input class="input" id="np" type="password" minlength="6" required autocomplete="new-password"></div>
        <button class="btn line">Update password</button></form></section>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2 class="h2">Addresses</h2><button class="btn accent sm" id="add">Add address</button></div>
      <ul class="rows" id="addrs"></ul>
    </div>
  </div>
</div></main>

<dialog id="ed"><form method="dialog"><h2 class="h2" style="margin-bottom:18px">Edit details</h2>
  <div class="field"><label for="e-n">Full name</label><input class="input" id="e-n" required></div>
  <div class="actions"><button class="btn quiet" value="x">Cancel</button><button class="btn accent" id="e-save" value="s">Save</button></div></form></dialog>
<dialog id="ad"><form method="dialog"><h2 class="h2" style="margin-bottom:18px">New address</h2>
  <div class="field"><label for="a-t">Label</label><input class="input" id="a-t" placeholder="Home, Office…"></div>
  <div class="field"><label for="a-l">Street address</label><input class="input" id="a-l"></div>
  <div class="field"><label for="a-m">Landmark</label><input class="input" id="a-m"></div>
  <div class="actions"><button class="btn quiet" value="x">Cancel</button><button class="btn accent" id="a-save" value="s">Save address</button></div></form></dialog>
<div id="site-footer"></div>
<script type="module">
import { api } from '/js/api.js'; import { auth } from '/js/auth.js'; import { toast } from '/js/toast.js'; import { esc } from '/js/shell.js';
const $ = id => document.getElementById(id);
if (!auth.requireAuth()) throw 0;
let me;
async function init() {
  try {
    me = await api.getMe(); auth.setUser(me);
    $('nm').textContent = me.name || 'Your account'; $('ph').textContent = me.phone;
    $('rl').textContent = ({ customer: 'Diner', shop_owner: 'Kitchen owner', admin: 'Admin' })[me.role] || me.role; addrs();
  } catch { toast.error('Your account could not be loaded'); }
}
async function addrs() {
  try {
    const a = await api.getAddresses();
    $('addrs').innerHTML = a.length ? a.map(x => `<li class="row" style="grid-template-columns:1fr auto;align-items:start">
      <div><strong>${esc(x.title || 'Address')}</strong> ${x.is_default ? '<span class="status open">Default</span>' : ''}<div class="muted">${esc(x.address_line)}</div>${x.landmark ? `<div class="small faint">Near ${esc(x.landmark)}</div>` : ''}</div>
      <div style="display:flex;gap:6px">${x.is_default ? '' : `<button class="btn line sm" data-a="def" data-id="${esc(x.id)}">Make default</button>`}<button class="btn quiet sm" data-a="del" data-id="${esc(x.id)}">Remove</button></div></li>`).join('')
      : `<li class="empty">No saved addresses. Add one to order for delivery.</li>`;
  } catch { $('addrs').innerHTML = `<li class="empty">Addresses could not be loaded.</li>`; }
}
$('addrs').addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  try {
    if (b.dataset.a === 'def') { await api.setDefaultAddress(b.dataset.id); toast.success('Default address changed'); }
    else { if (!confirm('Remove this address?')) return; await api.deleteAddress(b.dataset.id); toast.success('Address removed'); }
    addrs();
  } catch (err) { toast.error(err.message || 'That change could not be made'); }
});
$('edit').addEventListener('click', () => { $('e-n').value = me.name || ''; $('ed').showModal(); });
$('e-save').addEventListener('click', async e => {
  const name = $('e-n').value.trim(); if (!name) { e.preventDefault(); return toast.error('Name is required'); }
  try { await api.updateUserProfile({ name }); toast.success('Details saved'); init(); }
  catch (err) { toast.error(err.message || 'Details could not be saved'); }
});
$('pf').addEventListener('submit', async e => {
  e.preventDefault();
  try { await api.updatePassword($('op').value, $('np').value); toast.success('Password updated'); e.target.reset(); }
  catch (err) { toast.error(err.message || 'Password could not be updated'); }
});
$('add').addEventListener('click', () => $('ad').showModal());
$('a-save').addEventListener('click', async e => {
  const line = $('a-l').value.trim(); if (!line) { e.preventDefault(); return toast.error('Street address is required'); }
  try { await api.createAddress({ title: $('a-t').value.trim(), address_line: line, landmark: $('a-m').value.trim() }); toast.success('Address saved'); $('a-t').value = $('a-l').value = $('a-m').value = ''; addrs(); }
  catch (err) { toast.error(err.message || 'Address could not be saved'); }
});
init();
</script></body></html>
