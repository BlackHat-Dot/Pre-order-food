<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — preorder</title>
<link rel="stylesheet" href="/css/system.css">
</head>
<body>
<div id="site-header"></div>
<main class="auth"><div class="panel">
  <h1 class="h1">Create account</h1>
  <p class="muted" style="margin-bottom:24px">Order ahead and track preparation live.</p>
  <div class="grid2" style="margin-bottom:20px" role="radiogroup" aria-label="Account type">
    <label class="choice" style="margin:0"><span><input type="radio" name="role" value="customer" checked>Diner</span></label>
    <label class="choice" style="margin:0"><span><input type="radio" name="role" value="shop_owner">Kitchen</span></label>
  </div>
  <form id="f">
    <div class="field"><label for="name">Full name</label><input class="input" id="name" required autocomplete="name"></div>
    <div class="field"><label for="phone">Phone number</label>
      <div style="display:flex;gap:8px">
        <input class="input" id="phone" type="tel" placeholder="+919876543210" required autocomplete="tel">
        <button type="button" class="btn line sm" id="ver">Verify phone</button>
      </div>
      <div class="fb ok" id="vs" hidden style="margin-top:8px">Phone verified</div>
      <div id="cost-notice" style="margin-top:8px;padding:10px 14px;background:#fef3c7;border:1px solid #fde68a;border-radius:var(--radius-sm);color:#92400e;font-size:12.5px;line-height:1.45">
        ℹ️ <strong>Notice:</strong> SMS OTP service is not yet implemented due to carrier & telecom costs. Click <strong>Verify phone</strong> to verify directly.
      </div>
    </div>
    <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" minlength="6" required autocomplete="new-password"><span class="hint">At least 6 characters.</span></div>
    <button class="btn accent lg" id="go" style="width:100%;margin-top:8px">Create account</button>
  </form>
  <hr class="rule" style="margin:24px 0 16px">
  <p class="small muted">Already registered? <a href="/login.html"><strong>Log in</strong></a></p>
</div></main>
<div id="site-footer"></div>
<script type="module">
import { api } from '/js/api.js'; import { toast } from '/js/toast.js'; import '/js/shell.js';
const $ = id => document.getElementById(id);
if (new URLSearchParams(location.search).get('role') === 'shop_owner') document.querySelector('input[value=shop_owner]').checked = true;

let token = null;

async function verifyPhoneDirectly() {
  let phone = $('phone').value.trim();
  if (!phone) {
    toast.error('Enter your phone number first');
    return false;
  }
  if (!phone.startsWith('+')) {
    const digits = phone.replace(/\D/g, '');
    if (digits.length === 10) phone = '+91' + digits;
    else phone = '+' + digits;
  }
  if (phone.length < 10) {
    toast.error('Please enter a valid phone number');
    return false;
  }
  $('phone').value = phone;

  const btn = $('ver');
  btn.disabled = true;
  btn.textContent = 'Verifying…';

  try {
    const res = await api.verifyPhone(phone, 'direct_verify');
    token = res.verification_token || 'direct_verified_token_preorder';
    $('vs').hidden = false;
    $('vs').textContent = 'Phone verified ✓';
    btn.textContent = 'Verified ✓';
    btn.disabled = true;
    $('phone').readOnly = true;
    toast.success('Phone verified! (SMS OTP disabled due to carrier costs)');
    return true;
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Verify phone';
    toast.error(err.message || 'Verification failed. Phone may already be registered.');
    return false;
  }
}

$('phone').addEventListener('input', () => {
  if (token) {
    token = null;
    $('vs').hidden = true;
    $('ver').disabled = false;
    $('ver').textContent = 'Verify phone';
  }
});

$('ver').addEventListener('click', verifyPhoneDirectly);

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const phone = $('phone').value.trim();
  if (!token) {
    const ok = await verifyPhoneDirectly();
    if (!ok) return;
  }
  const role = document.querySelector('input[name=role]:checked').value;
  const name = $('name').value.trim();
  const password = $('pw').value;
  const b = $('go'); b.disabled = true; b.textContent = 'Creating account…';
  try {
    await api.register({ role, name, phone, password, phone_verification_token: token });
    await api.login(phone, password);
    toast.success('Account created successfully');
    setTimeout(() => location.href = role === 'shop_owner' ? '/owner.html' : '/index.html', 400);
  } catch (err) {
    toast.error(err.message || 'Could not create the account');
    b.disabled = false;
    b.textContent = 'Create account';
  }
});
</script></body></html>
