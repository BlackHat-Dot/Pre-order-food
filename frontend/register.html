<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — preorder</title>
<link rel="stylesheet" href="/css/system.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>
<div id="site-header"></div>
<main class="auth"><div class="panel">
  <h1 class="h1">Create account</h1>
  <p class="muted" style="margin-bottom:24px">Order ahead and track preparation live.</p>
  <div class="grid2" style="margin-bottom:20px" role="radiogroup" aria-label="Account type">
    <label class="choice" style="margin:0"><span><input type="radio" name="role" value="customer" checked>Diner</span></label>
    <label class="choice" style="margin:0"><span><input type="radio" name="role" value="shop_owner">Kitchen</span></label>
  </div>
  <form id="f">
    <div class="field"><label for="name">Full name</label><input class="input" id="name" required autocomplete="name"></div>
    <div class="field"><label for="phone">Phone number</label>
      <div style="display:flex;gap:8px"><input class="input" id="phone" type="tel" placeholder="+919876543210" required autocomplete="tel"><button type="button" class="btn line sm" id="ver">Send OTP</button></div>
      <div id="otp-panel" hidden style="margin-top:12px;padding:14px;background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-sm)">
        <label for="otp-code" class="small" style="display:block;margin-bottom:6px;font-weight:600">Enter 6-digit OTP code sent via SMS</label>
        <div style="display:flex;gap:8px">
          <input class="input" id="otp-code" type="text" inputmode="numeric" maxlength="6" placeholder="123456" style="letter-spacing:6px;font-weight:700;font-size:16px">
          <button type="button" class="btn accent sm" id="btn-confirm-otp">Verify code</button>
        </div>
        <p class="hint" style="margin-top:6px" id="otp-status">SMS OTP sent via Google Firebase. Enter code to continue.</p>
      </div>
      <div class="fb ok" id="vs" hidden>Phone verified</div>
    </div>
    <div id="recaptcha-container"></div>
    <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" minlength="6" required autocomplete="new-password"><span class="hint">At least 6 characters.</span></div>
    <button class="btn accent lg" id="go" style="width:100%;margin-top:8px">Create account</button>
  </form>
  <hr class="rule" style="margin:24px 0 16px">
  <p class="small muted">Already registered? <a href="/login.html"><strong>Log in</strong></a></p>
</div></main>
<div id="site-footer"></div>
<script type="module">
import { api } from '/js/api.js'; import { toast } from '/js/toast.js'; import '/js/shell.js';
const $ = id => document.getElementById(id);
if (new URLSearchParams(location.search).get('role') === 'shop_owner') document.querySelector('input[value=shop_owner]').checked = true;

const firebaseConfig = {
  apiKey: "AIzaSyBWW6GIPeIf30LJVx3rJUO1n1FO_O33_z4",
  authDomain: "pre-order-food-68244.firebaseapp.com",
  projectId: "pre-order-food-68244",
  storageBucket: "pre-order-food-68244.firebasestorage.app",
  messagingSenderId: "408686821436",
  appId: "1:408686821436:web:674e4ffb07a46e31f08339",
  measurementId: "G-RJWEH420QX"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const fbAuth = firebase.auth();
fbAuth.useDeviceLanguage();

let confirmationResult = null;
let recaptchaVerifier = null;
let token = null;

function getRecaptcha() {
  if (!recaptchaVerifier) {
    recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
      size: 'invisible',
      callback: () => {}
    });
  }
  return recaptchaVerifier;
}

async function sendOtp() {
  let phone = $('phone').value.trim();
  if (!phone) return toast.error('Enter your phone number first');
  if (!phone.startsWith('+')) phone = '+91' + phone.replace(/\D/g, '');
  $('phone').value = phone;

  const btn = $('ver');
  btn.disabled = true;
  btn.textContent = 'Sending SMS…';

  try {
    const verifier = getRecaptcha();
    confirmationResult = await fbAuth.signInWithPhoneNumber(phone, verifier);
    btn.textContent = 'OTP Sent';
    $('otp-panel').hidden = false;
    $('otp-code').value = '';
    $('otp-code').focus();
    toast.success('OTP sent to ' + phone);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Send OTP';
    console.error('Firebase phone auth error:', err);
    if (recaptchaVerifier) {
      try { recaptchaVerifier.clear(); } catch {}
      recaptchaVerifier = null;
    }
    toast.error(err.message || 'Could not send SMS. Check phone format.');
  }
}

async function confirmOtp() {
  const code = $('otp-code').value.trim();
  if (!code || code.length < 6) return toast.error('Enter the complete 6-digit OTP');
  const btn = $('btn-confirm-otp');
  btn.disabled = true;
  btn.textContent = 'Verifying…';

  try {
    if (!confirmationResult) throw new Error('Request OTP first');
    const result = await confirmationResult.confirm(code);
    const idToken = await result.user.getIdToken();
    const phone = $('phone').value.trim();

    const r = await api.verifyPhone(phone, idToken);
    token = r.verification_token;

    $('otp-panel').hidden = true;
    $('vs').hidden = false;
    $('ver').textContent = 'Verified';
    $('ver').disabled = true;
    $('phone').readOnly = true;
    toast.success('Phone verified successfully!');
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Verify code';
    console.error('Confirm OTP error:', err);
    toast.error(err.message || 'Invalid OTP code. Please check and try again.');
  }
}

$('phone').addEventListener('input', () => {
  if (token) {
    token = null;
    $('vs').hidden = true;
    $('ver').disabled = false;
    $('ver').textContent = 'Send OTP';
    $('otp-panel').hidden = true;
  }
});

$('ver').addEventListener('click', sendOtp);
$('btn-confirm-otp').addEventListener('click', confirmOtp);

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const phone = $('phone').value.trim();
  if (!token) {
    toast.error('Please verify your phone number via OTP first');
    return sendOtp();
  }
  const role = document.querySelector('input[name=role]:checked').value;
  const name = $('name').value.trim();
  const password = $('pw').value;
  const b = $('go'); b.disabled = true; b.textContent = 'Creating account…';
  try {
    await api.register({ role, name, phone, password, phone_verification_token: token });
    await api.login(phone, password);
    toast.success('Account created');
    setTimeout(() => location.href = role === 'shop_owner' ? '/owner.html' : '/index.html', 400);
  } catch (err) {
    toast.error(err.message || 'Could not create the account');
    b.disabled = false;
    b.textContent = 'Create account';
  }
});
</script></body></html>
