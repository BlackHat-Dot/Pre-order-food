<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — preorder</title>
<link rel="stylesheet" href="/css/system.css">
</head>
<body>
<div id="site-header"></div>
<main class="auth"><div class="panel">
  <h1 class="h1">Create account</h1>
  <p class="muted" style="margin-bottom:24px">Order ahead and track preparation live.</p>
  <div class="grid2" style="margin-bottom:20px" role="radiogroup" aria-label="Account type">
    <label class="choice" style="margin:0"><span><input type="radio" name="role" value="customer" checked>Diner</span></label>
    <label class="choice" style="margin:0"><span><input type="radio" name="role" value="shop_owner">Kitchen</span></label>
  </div>
  <form id="f">
    <div class="field"><label for="name">Full name</label><input class="input" id="name" required autocomplete="name"></div>
    <div class="field"><label for="phone">Phone number</label>
      <div style="display:flex;gap:8px"><input class="input" id="phone" type="tel" placeholder="+919876543210" required autocomplete="tel"><button type="button" class="btn line sm" id="ver">Verify</button></div>
      <div class="fb ok" id="vs" hidden>Phone verified</div></div>
    <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" minlength="6" required autocomplete="new-password"><span class="hint">At least 6 characters.</span></div>
    <button class="btn accent lg" id="go" style="width:100%;margin-top:8px">Create account</button>
  </form>
  <hr class="rule" style="margin:24px 0 16px">
  <p class="small muted">Already registered? <a href="/login.html"><strong>Log in</strong></a></p>
</div></main>
<div id="site-footer"></div>
<script type="module">
import { api } from '/js/api.js'; import { toast } from '/js/toast.js'; import '/js/shell.js';
const $ = id => document.getElementById(id);
if (new URLSearchParams(location.search).get('role') === 'shop_owner') document.querySelector('input[value=shop_owner]').checked = true;

const MSG91_SDK_URL = "https://control.msg91.com/app/assets/otp-provider/otp-provider.js";
const WIDGET_ID = window.MSG91_WIDGET_ID || "36656c6f6867323433323337";
const TOKEN_AUTH = window.MSG91_TOKEN_AUTH || "516068TEEotSwiUFzE6a0347acP1";

let token = null;

function loadMsg91Sdk() {
  if (window.initSendOTP) return Promise.resolve();
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${MSG91_SDK_URL}"]`)) { resolve(); return; }
    const script = document.createElement("script");
    script.src = MSG91_SDK_URL;
    script.async = true;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("Failed to load MSG91 phone verification service"));
    document.head.appendChild(script);
  });
}

async function startVerification() {
  const phone = $('phone').value.trim();
  if (!phone) return toast.error('Enter your phone number first');
  const btn = $('ver');
  btn.disabled = true;
  btn.textContent = 'Sending OTP…';

  try {
    await loadMsg91Sdk();
    if (!window.initSendOTP) {
      throw new Error('Phone verification service could not be initialized.');
    }

    const cleanIdentifier = phone.replace(/\D/g, '');

    window.initSendOTP({
      widgetId: WIDGET_ID,
      tokenAuth: TOKEN_AUTH,
      identifier: cleanIdentifier,
      success: async (data) => {
        try {
          btn.textContent = 'Verifying…';
          const reqId = data?.message || data?.req_id || data?.token || (typeof data === 'string' ? data : JSON.stringify(data));
          const r = await api.verifyPhone(phone, reqId);
          token = r.verification_token;
          $('vs').hidden = false;
          btn.textContent = 'Verified';
          btn.disabled = true;
          toast.success('Phone verified successfully!');
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Verify';
          toast.error(err.message || 'Verification confirmation failed');
        }
      },
      failure: (err) => {
        btn.disabled = false;
        btn.textContent = 'Verify';
        const msg = typeof err === 'string' ? err : err?.message || 'Phone verification failed';
        toast.error(msg);
      }
    });
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Verify';
    toast.error(err.message || 'Could not launch verification');
  }
}

$('phone').addEventListener('input', () => {
  if (token) {
    token = null;
    $('vs').hidden = true;
    $('ver').disabled = false;
    $('ver').textContent = 'Verify';
  }
});

$('ver').addEventListener('click', startVerification);

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const phone = $('phone').value.trim();
  if (!token) {
    toast.error('Please verify your phone number via OTP first');
    return startVerification();
  }
  const role = document.querySelector('input[name=role]:checked').value;
  const name = $('name').value.trim();
  const password = $('pw').value;
  const b = $('go'); b.disabled = true; b.textContent = 'Creating account…';
  try {
    await api.register({ role, name, phone, password, phone_verification_token: token });
    await api.login(phone, password);
    toast.success('Account created');
    setTimeout(() => location.href = role === 'shop_owner' ? '/owner.html' : '/index.html', 400);
  } catch (err) {
    toast.error(err.message || 'Could not create the account');
    b.disabled = false;
    b.textContent = 'Create account';
  }
});
</script></body></html>
