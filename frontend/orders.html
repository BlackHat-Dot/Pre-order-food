<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — preorder</title>
<link rel="stylesheet" href="/css/system.css">
</head>
<body>
<div id="site-header"></div>
<main class="page"><div class="wrap">
  <section id="track" hidden>
    <div class="page-head"><div><h1 class="h1" id="t-num">Order</h1><p class="muted" id="t-meta"></p></div><button class="btn line" id="back">All orders</button></div>
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap"><div><div class="small muted">Estimated wait</div><div class="eta" id="t-eta">—</div></div><span class="status" id="t-status"></span></div>
      <div class="pipe" id="pipe"><div data-s="pending">Sent</div><div data-s="accepted">Accepted</div><div data-s="preparing">Cooking</div><div data-s="ready">Ready</div><div data-s="completed">Collected</div></div>
      <div class="banner-note" id="t-cancel" hidden></div>
      <div class="split even" style="margin-top:24px">
        <div id="t-items"></div>
        <div><dl><div class="kv total" style="border-top:0;margin:0;padding-top:0"><dt>Total</dt><dd class="num" id="t-total"></dd></div>
          <div class="kv"><dt>Payment</dt><dd id="t-pay"></dd></div></dl>
          <button class="btn danger" id="t-cancel-btn" style="width:100%;margin-top:18px" hidden>Request cancellation</button></div>
      </div>
    </div>
  </section>

  <section id="list">
    <div class="page-head"><div><h1 class="h1">Your orders</h1><p class="muted" id="count"></p></div></div>
    <div class="tabs" id="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-f="">All</button><button role="tab" aria-selected="false" data-f="active">In progress</button>
      <button role="tab" aria-selected="false" data-f="completed">Collected</button><button role="tab" aria-selected="false" data-f="cancelled">Cancelled</button></div>
    <div class="tbl-wrap" style="border-top:0"><table class="tbl"><thead><tr><th>Order</th><th>Placed</th><th>Kitchen</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="body"></tbody></table></div>
  </section>
</div></main>

<dialog id="cd"><form method="dialog">
  <h2 class="h2" style="margin-bottom:6px">Cancel this order?</h2>
  <p class="muted small" style="margin-bottom:18px">You can cancel before the kitchen starts cooking. The kitchen will confirm.</p>
  <div class="field"><label for="why">Reason (optional)</label><textarea class="input" id="why"></textarea></div>
  <div class="actions"><button class="btn quiet" value="x">Keep order</button><button class="btn danger" id="c-ok" value="y">Request cancellation</button></div>
</form></dialog>
<div id="site-footer"></div>
<script type="module">
import { api } from '/js/api.js'; import { auth } from '/js/auth.js'; import { toast } from '/js/toast.js'; import { esc, formatPrice, formatDate } from '/js/shell.js';
const $ = id => document.getElementById(id);
if (!auth.requireAuth()) throw 0;
const STEPS = ['pending', 'accepted', 'preparing', 'ready', 'completed'];
const LABEL = { pending: 'Sent', accepted: 'Accepted', preparing: 'Cooking', ready: 'Ready', completed: 'Collected', cancelled: 'Cancelled', cancel_requested: 'Cancel requested' };
const cls = st => st === 'completed' || st === 'ready' ? 'open' : (st === 'cancelled' || st === 'cancel_requested') ? 'shut' : '';
let all = [], filter = '', cur = null, timer = null;

async function openOrder(id) {
  $('list').hidden = true; $('track').hidden = false;
  try { cur = await api.getOrder(id); paint(cur); poll(id); } catch { toast.error('That order could not be found'); showList(); }
}
function paint(o) {
  $('t-num').textContent = `Order #${o.order_number || o.id.slice(0, 8).toUpperCase()}`;
  $('t-meta').textContent = `${o.shop?.name || 'Kitchen'} · ${o.order_type === 'delivery' ? 'Delivery' : 'Counter pickup'}`;
  $('t-total').textContent = formatPrice(o.total_price || o.total_amount);
  $('t-pay').textContent = `${(o.payment_method || 'cod').toUpperCase()} · ${o.payment_status || 'unpaid'}`;
  $('t-status').textContent = LABEL[o.status] || o.status; $('t-status').className = `status ${cls(o.status)}`;
  const dead = o.status === 'cancelled' || o.status === 'cancel_requested';
  $('t-cancel').hidden = !dead; if (dead) $('t-cancel').textContent = o.cancellation_reason ? `Reason: ${o.cancellation_reason}` : (o.status === 'cancelled' ? 'This order was cancelled.' : 'Waiting for the kitchen to confirm the cancellation.');
  $('t-eta').textContent = dead ? 'Cancelled' : { completed: 'Collected', ready: 'Ready now', preparing: '~10 min' }[o.status] || '~15 min';
  $('t-cancel-btn').hidden = !['pending', 'accepted'].includes(o.status);
  const idx = STEPS.indexOf(o.status);
  document.querySelectorAll('#pipe div').forEach(d => { const i = STEPS.indexOf(d.dataset.s); d.className = dead ? '' : i < idx || o.status === 'completed' ? 'done' : i === idx ? 'now' : ''; });
  $('t-items').innerHTML = (o.items || []).map(i => `<div class="kv"><dt>${i.quantity} × ${esc(i.item_name_snapshot || i.item_name || 'Dish')}${(i.variant_name_snapshot || i.variant_name) ? ` (${esc(i.variant_name_snapshot || i.variant_name)})` : ''}</dt><dd class="num">${formatPrice(i.total_price || i.unit_price * i.quantity)}</dd></div>`).join('') || '<p class="muted">Items unavailable.</p>';
}
function poll(id) {
  clearInterval(timer);
  timer = setInterval(async () => { try { cur = await api.getOrder(id); paint(cur); if (['completed', 'cancelled'].includes(cur.status)) clearInterval(timer); } catch {} }, 5000);
}
function showList() { clearInterval(timer); history.pushState({}, '', '/orders.html'); $('track').hidden = true; $('list').hidden = false; load(); }
$('back').addEventListener('click', showList);

async function load() {
  try { all = await api.getCustomerOrders({ page: 1, page_size: 50 }); render(); }
  catch { $('body').innerHTML = `<tr><td colspan="7" class="empty">Orders could not be loaded. Refresh to try again.</td></tr>`; }
}
function render() {
  const rows = all.filter(o => !filter || (filter === 'active' && ['pending', 'accepted', 'preparing', 'ready'].includes(o.status)) || (filter === 'completed' && o.status === 'completed') || (filter === 'cancelled' && ['cancelled', 'cancel_requested'].includes(o.status)));
  $('count').textContent = `${rows.length} of ${all.length} orders`;
  $('body').innerHTML = rows.length ? rows.map(o => `<tr>
    <td class="num"><strong>#${esc(o.order_number || o.id.slice(0, 8).toUpperCase())}</strong></td><td class="muted num">${formatDate(o.created_at)}</td>
    <td>${esc(o.shop?.name || 'Kitchen')}</td><td class="num">${(o.items || []).reduce((n, i) => n + i.quantity, 0)}</td>
    <td class="num"><strong>${formatPrice(o.total_price || o.total_amount)}</strong></td><td><span class="status ${cls(o.status)}">${LABEL[o.status] || esc(o.status)}</span></td>
    <td><button class="btn line sm" data-id="${esc(o.id)}">Track</button></td></tr>`).join('')
    : `<tr><td colspan="7" class="empty">No orders here yet. <a href="/index.html"><strong>Find a kitchen</strong></a></td></tr>`;
}
$('body').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b) { history.pushState({}, '', `/orders.html?id=${b.dataset.id}`); openOrder(b.dataset.id); } });
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x === b)); filter = b.dataset.f; render(); });
$('t-cancel-btn').addEventListener('click', () => $('cd').showModal());
$('c-ok').addEventListener('click', async () => {
  try { await api.updateOrderStatus(cur.id, { status: 'cancel_requested', reason: $('why').value.trim() || 'Customer requested cancellation before preparation.' }); toast.success('Cancellation requested'); openOrder(cur.id); }
  catch (err) { toast.error(err.message || 'Cancellation could not be requested'); }
});
const id = new URLSearchParams(location.search).get('id');
id ? openOrder(id) : load();
</script></body></html>
