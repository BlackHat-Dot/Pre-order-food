<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — PreOrder</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .order-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      transition: all 0.2s ease;
    }
    .order-card:hover {
      border-color: rgba(245, 158, 11, 0.4);
    }
  </style>
</head>
<body>
  <div class="bg-ambient">
    <div class="bg-ambient-gradient"></div>
    <div class="bg-ambient-grid"></div>
  </div>

  <div id="navbar-root"></div>

  <main style="padding: 3rem 0 5rem;">
    <div class="container" style="max-width: 900px;">
      <h1 style="font-size: 2rem; font-weight: 800; letter-spacing: -0.02em;">My Orders</h1>
      <p style="color: var(--foreground-muted); font-size: 0.875rem; margin-top: 0.25rem;">Track your active pre-orders and past meals.</p>

      <div style="margin-top: 2rem;" id="orders-list">
        <div style="text-align: center; padding: 4rem; color: var(--muted-foreground);">Loading your orders...</div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © 2026 PreOrder. All rights reserved.
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function loadOrders() {
      if (!window.auth.isLoggedIn()) {
        window.location.href = "login.html?redirect=orders.html";
        return;
      }

      const container = document.getElementById("orders-list");

      try {
        const orders = await window.api.orders.listMyOrders();
        
        if (!orders || orders.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 5rem 1rem; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius-lg);">
              <div style="font-size: 3rem; margin-bottom: 1rem;">📦</div>
              <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">No orders yet</h3>
              <p style="color: var(--foreground-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">Your placed orders will show up here.</p>
              <a href="index.html" class="btn btn-primary">Find a Shop</a>
            </div>
          `;
          return;
        }

        container.innerHTML = orders.map(o => {
          const statusBadge = renderStatusBadge(o.status);
          const dateStr = new Date(o.created_at || Date.now()).toLocaleDateString("en-US", {
            month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
          });

          const itemsText = (o.items || []).map(i => `${i.quantity}x ${i.item_name_snapshot || 'Item'}`).join(", ") || "Standard order";

          let cancelBtn = "";
          if (o.status === "placed") {
            cancelBtn = `<button onclick="cancelOrder('${o.id}')" class="btn btn-outline btn-sm" style="color: var(--destructive);">Cancel Order</button>`;
          } else if (o.status === "accepted" || o.status === "preparing") {
            cancelBtn = `<button onclick="requestCancelOrder('${o.id}')" class="btn btn-outline btn-sm">Request Cancellation</button>`;
          }

          return `
            <div class="order-card">
              <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
                <div>
                  <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <span style="font-weight: 800; font-size: 1.1rem;">Order #${o.id.substring(0, 8)}</span>
                    ${statusBadge}
                  </div>
                  <div style="font-size: 0.8125rem; color: var(--foreground-muted); margin-top: 0.25rem;">
                    Placed on ${dateStr}
                  </div>
                </div>
                <div style="font-size: 1.25rem; font-weight: 800; color: var(--primary);">
                  ${formatCurrency(o.total_price)}
                </div>
              </div>

              <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.875rem 1rem; font-size: 0.875rem; color: var(--foreground-muted); margin-bottom: 1rem;">
                <span style="font-weight: 600; color: #fff;">Dishes:</span> ${itemsText}
              </div>

              <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem;">
                <span style="font-size: 0.8125rem; color: var(--muted-foreground);">Payment: <b>${o.payment_method || 'Cash'}</b> (${o.payment_status || 'pending'})</span>
                <div>${cancelBtn}</div>
              </div>
            </div>
          `;
        }).join("");

      } catch (err) {
        container.innerHTML = `
          <div style="padding: 2rem; background: var(--destructive-bg); border-radius: var(--radius); color: var(--destructive-foreground); text-align: center;">
            <p>Failed to load orders: ${err.message}</p>
          </div>
        `;
      }
    }

    async function cancelOrder(orderId) {
      if (confirm("Cancel this order immediately?")) {
        try {
          await window.api.orders.cancel(orderId, "Customer cancelled");
          showToast("success", "Order cancelled.");
          loadOrders();
        } catch (err) {
          showToast("error", err.message);
        }
      }
    }

    async function requestCancelOrder(orderId) {
      if (confirm("Send a cancellation request to the kitchen?")) {
        try {
          await window.api.orders.requestCancellation(orderId, "Customer requested");
          showToast("success", "Cancellation request sent.");
          loadOrders();
        } catch (err) {
          showToast("error", err.message);
        }
      }
    }

    document.addEventListener("DOMContentLoaded", loadOrders);
  </script>
</body>
</html>
