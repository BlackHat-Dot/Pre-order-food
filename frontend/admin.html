<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — preorder</title>
<link rel="stylesheet" href="/css/system.css">
</head>
<body>
<div id="site-header"></div>
<main class="page"><div class="wrap">
  <div class="page-head"><div><h1 class="h1">Platform admin</h1><p class="muted">Usage totals and kitchen verification.</p></div></div>
  <div class="stats"><div><b id="u">—</b><span>Accounts</span></div><div><b id="k">—</b><span>Kitchens</span></div><div><b id="o">—</b><span>Orders</span></div><div><b id="g">—</b><span>Order value</span></div></div>
  <h2 class="h2" style="margin-bottom:6px">Kitchens</h2><p class="muted small" id="count" style="margin-bottom:16px"></p>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kitchen</th><th>Location</th><th>Phone</th><th>Category</th><th>Status</th><th></th></tr></thead><tbody id="body"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody></table></div>
</div></main>
<div id="site-footer"></div>
<script type="module">
import { api } from '/js/api.js'; import { auth } from '/js/auth.js'; import { toast } from '/js/toast.js'; import { esc, formatPrice } from '/js/shell.js';
const $ = id => document.getElementById(id);

let currentUser = null;
try {
  currentUser = await api.getCurrentUser();
} catch (err) {
  auth.logout();
  throw 0;
}
if (!currentUser || currentUser.role !== 'admin') {
  auth.logout();
  throw 0;
}

api.getAdminStats().then(s => { $('u').textContent = s.total_users || 0; $('k').textContent = s.total_shops || 0; $('o').textContent = s.total_orders || 0; $('g').textContent = formatPrice(s.total_gmv || 0); }).catch(() => toast.error('Totals could not be loaded'));
async function shops() {
  try {
    const list = await api.getAdminShops(1, 50); $('count').textContent = `${list.length} kitchens`;
    $('body').innerHTML = list.length ? list.map(s => { const v = !!s.is_verified; return `<tr>
      <td><strong>${esc(s.name)}</strong><div class="hint num">${esc(s.id.slice(0, 8))}</div></td><td>${esc(s.city || '—')}, ${esc(s.state || '—')}</td><td class="num">${esc(s.phone)}</td><td>${esc(s.category || 'Gourmet')}</td>
      <td><span class="status ${v ? 'open' : ''}">${v ? 'Verified' : 'Pending review'}</span></td>
      <td><button class="btn ${v ? 'line' : 'accent'} sm" data-id="${esc(s.id)}" data-v="${v}">${v ? 'Revoke' : 'Verify'}</button></td></tr>`; }).join('')
      : `<tr><td colspan="6" class="empty">No kitchens registered yet.</td></tr>`;
  } catch { $('body').innerHTML = `<tr><td colspan="6" class="empty">Kitchens could not be loaded.</td></tr>`; }
}
$('body').addEventListener('click', async e => {
  const b = e.target.closest('button[data-id]'); if (!b) return; const now = b.dataset.v !== 'true';
  try { await api.verifyAdminShop(b.dataset.id, now); toast.success(now ? 'Kitchen verified' : 'Verification revoked'); shops(); }
  catch (err) { toast.error(err.message || 'Could not update verification'); }
});
shops();
</script></body></html>
