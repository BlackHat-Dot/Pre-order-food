<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — PreOrder</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="bg-ambient">
    <div class="bg-ambient-gradient"></div>
    <div class="bg-ambient-grid"></div>
  </div>

  <div id="navbar-root"></div>

  <main style="padding: 3rem 0 5rem;">
    <div class="container">
      <h1 style="font-size: 2rem; font-weight: 800; letter-spacing: -0.02em;">Platform Administration</h1>
      <p style="color: var(--foreground-muted); font-size: 0.875rem; margin-top: 0.25rem;">Global stats, restaurant verifications, and user management.</p>

      <!-- Stats Grid -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; margin-top: 2rem;">
        <div class="stat-card">
          <div style="font-size: 0.8125rem; color: var(--foreground-muted);">Total Users</div>
          <div id="stat-users" style="font-size: 2rem; font-weight: 800; color: var(--foreground); margin-top: 0.25rem;">...</div>
        </div>
        <div class="stat-card">
          <div style="font-size: 0.8125rem; color: var(--foreground-muted);">Total Shops</div>
          <div id="stat-shops" style="font-size: 2rem; font-weight: 800; color: var(--primary); margin-top: 0.25rem;">...</div>
        </div>
        <div class="stat-card">
          <div style="font-size: 0.8125rem; color: var(--foreground-muted);">Verified Shops</div>
          <div id="stat-verified" style="font-size: 2rem; font-weight: 800; color: var(--success); margin-top: 0.25rem;">...</div>
        </div>
      </div>

      <!-- Shop Approvals Section -->
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 1.75rem; margin-top: 2.5rem;">
        <h3 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 1.25rem;">Restaurants & Verification</h3>
        <div id="admin-shops-table">
          <div style="color: var(--muted-foreground); text-align: center; padding: 2rem;">Loading shops...</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © 2026 PreOrder. All rights reserved.
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function initAdmin() {
      const user = window.auth.getUser();
      if (!user || user.role !== "admin") {
        window.location.href = "login.html";
        return;
      }

      loadStats();
      loadShopsList();
    }

    async function loadStats() {
      try {
        const userStats = await window.api.admin.countUsers();
        document.getElementById("stat-users").textContent = userStats?.total || 0;
      } catch {}

      try {
        const shopStats = await window.api.admin.countShops();
        document.getElementById("stat-shops").textContent = shopStats?.total || 0;
        document.getElementById("stat-verified").textContent = shopStats?.verified || 0;
      } catch {}
    }

    async function loadShopsList() {
      const container = document.getElementById("admin-shops-table");
      try {
        const res = await window.api.admin.listShops(1);
        const shops = res?.items || res || [];

        if (shops.length === 0) {
          container.innerHTML = `<p style="color: var(--muted-foreground); text-align: center;">No shops registered yet.</p>`;
          return;
        }

        container.innerHTML = shops.map(shop => `
          <div style="display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.75rem;">
            <div>
              <div style="font-weight: 700; font-size: 0.95rem;">${shop.name}</div>
              <div style="font-size: 0.785rem; color: var(--foreground-muted);">${shop.cuisine || 'Cuisine'} · ${shop.address || 'Address'}</div>
            </div>
            <div>
              ${shop.is_verified 
                ? '<span class="badge" style="background: rgba(16, 185, 129, 0.15); color: var(--success);">✓ Verified</span>' 
                : `<button onclick="verifyShop('${shop.id}')" class="btn btn-outline btn-sm" style="color: var(--primary);">Verify Partner</button>`}
            </div>
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = `<p style="color: var(--destructive);">Failed to load shops: ${err.message}</p>`;
      }
    }

    async function verifyShop(shopId) {
      try {
        await window.api.admin.verifyShop(shopId);
        showToast("success", "Shop verified!");
        loadStats();
        loadShopsList();
      } catch (err) {
        showToast("error", err.message);
      }
    }

    document.addEventListener("DOMContentLoaded", initAdmin);
  </script>
</body>
</html>
