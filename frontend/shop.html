<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen — preorder</title>
  <link rel="stylesheet" href="/css/system.css">
  <style>
    .banner{height:clamp(160px,28vw,340px);background:var(--line) center/cover}
    .shop-head{padding:clamp(32px,5vw,64px) 0 32px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
    .meta{display:flex;flex-wrap:wrap;gap:6px 28px;margin-top:20px;font-size:.92rem;color:var(--ink-2)}
    .sticky{position:sticky;top:64px;z-index:40;background:var(--bg)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:clamp(32px,6vw,80px);align-items:start;padding-bottom:96px}
    .group h2{margin:44px 0 14px}
    .dish{grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:start}
    .dish .name{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:-.02em}
    .dish .desc{grid-column:1;color:var(--ink-2);font-size:.95rem;max-width:60ch}
    .dish .buy{grid-column:2;grid-row:1/3;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
    .sig{font-size:.75rem;font-weight:700;background:var(--saffron);padding:2px 8px;border-radius:99px;font-family:var(--body);letter-spacing:0}
    .sold{opacity:.5}
    .reviews{position:sticky;top:140px}
    .score{font-family:var(--display);font-weight:800;font-size:3.4rem;letter-spacing:-.05em;line-height:1}
    .rev{padding:14px 0;border-bottom:1px solid var(--line-2)}
    @media (max-width:900px){.layout{grid-template-columns:1fr}.reviews{position:static}.shop-head{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="banner" id="banner" hidden></div>
    <div class="wrap">
      <div class="shop-head" id="head"><p class="muted">Loading kitchen…</p></div>
    </div>
    <div class="sticky"><div class="wrap"><div class="tabs" id="cats" role="tablist"></div></div></div>

    <div class="wrap layout">
      <div id="menu"></div>
      <aside class="reviews">
        <h2 class="h2" style="margin-top:44px">Diner reviews</h2>
        <div style="display:flex;align-items:baseline;gap:12px;margin:14px 0 8px"><span class="score" id="score">—</span><span class="muted small" id="rcount"></span></div>
        <div id="reviews" style="max-height:340px;overflow:auto"></div>
        <button class="btn line sm" id="write" style="margin-top:16px">Write a review</button>
      </aside>
    </div>
  </main>

  <dialog id="vd"><form method="dialog">
    <h2 class="h2" id="vd-title" style="margin-bottom:6px"></h2>
    <p class="muted small" style="margin-bottom:18px">Choose an option.</p>
    <div id="vd-opts"></div>
    <div class="actions"><button class="btn quiet" value="x">Cancel</button><button class="btn accent" id="vd-add" value="add">Add to order</button></div>
  </form></dialog>

  <dialog id="rd"><form method="dialog">
    <h2 class="h2" style="margin-bottom:18px">Review this kitchen</h2>
    <div class="field"><label for="rate">Rating</label>
      <select class="input" id="rate"><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Okay</option><option value="2">2 — Poor</option><option value="1">1 — Bad</option></select></div>
    <div class="field"><label for="rtext">Comment (optional)</label><textarea class="input" id="rtext" placeholder="How was the food and the wait?"></textarea></div>
    <div class="actions"><button class="btn quiet" value="x">Cancel</button><button class="btn accent" id="r-send" value="send">Post review</button></div>
  </form></dialog>

  <div id="site-footer"></div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { cart } from '/js/cart.js';
    import { toast } from '/js/toast.js';
    import { esc, formatPrice } from '/js/shell.js';

    const id = new URLSearchParams(location.search).get('id');
    if (!id) location.href = '/index.html';
    let shop, menu = [], active = '', pending = null;
    const $ = s => document.getElementById(s);

    try {
      [shop, menu] = await Promise.all([api.getShop(id), api.getMenuItems(id)]);
    } catch {
      $('head').innerHTML = `<div><h1 class="h1">Kitchen not found</h1><p class="muted" style="margin:10px 0 20px">It may have closed or the link is wrong.</p><a class="btn" href="/index.html">Browse kitchens</a></div>`;
      throw 0;
    }
    document.title = `${shop.name} — preorder`;
    const open = shop.is_open && shop.is_accepting_orders;
    if (shop.banner_url) { $('banner').hidden = false; $('banner').style.backgroundImage = `url("${shop.banner_url.replace(/"/g, '%22')}")`; }
    $('head').innerHTML = `
      <div><h1 class="display" style="font-size:clamp(2.4rem,6vw,4.8rem)">${esc(shop.name)}</h1>
        <p class="lede" style="margin-top:14px">${esc(shop.description || '')}</p>
        <div class="meta"><span>${esc(shop.category || 'Kitchen')}</span><span>${esc(shop.address_line || '')}, ${esc(shop.city || '')} ${esc(shop.pincode || '')}</span><span>${esc(shop.opening_hours || '10:00–22:00')}</span><span>${esc(shop.phone || '')}</span></div></div>
      <span class="status ${open ? 'open' : 'shut'}">${open ? 'Taking orders' : 'Paused right now'}</span>`;

    const cats = [...new Set(menu.map(m => m.category || 'Specialties'))];
    $('cats').innerHTML = [''].concat(cats).map(c => `<button role="tab" aria-selected="${c === ''}" data-c="${esc(c)}">${c || 'Everything'}</button>`).join('');
    $('cats').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      document.querySelectorAll('#cats button').forEach(x => x.setAttribute('aria-selected', x === b));
      active = b.dataset.c; render();
    });

    function render() {
      const items = menu.filter(m => !active || (m.category || 'Specialties') === active);
      if (!items.length) { $('menu').innerHTML = `<p class="empty">This kitchen hasn't published a menu yet.</p>`; return; }
      const g = {}; items.forEach(m => (g[m.category || 'Specialties'] ||= []).push(m));
      $('menu').innerHTML = Object.entries(g).map(([c, list]) => `
        <section class="group"><h2 class="h2">${esc(c)}</h2><ul class="rows">${list.map(dish).join('')}</ul></section>`).join('');
    }

    function dish(d) {
      const vs = d.variants || [], avail = d.is_available !== false;
      const from = vs.length ? Math.min(d.price, ...vs.map(v => v.price)) : d.price;
      return `<li class="row dish ${avail ? '' : 'sold'}">
        <div class="name"><span class="diet ${esc(d.dietary_type || 'veg')}" title="${esc((d.dietary_type || 'veg').replace('_', '-'))}"></span>${esc(d.name)}${d.is_featured ? '<span class="sig">Signature</span>' : ''}</div>
        <p class="desc">${esc(d.description || '')} <span class="faint num">About ${d.prep_time_minutes || 15} min</span></p>
        <div class="buy"><span class="num"><strong>${vs.length ? '<span class="faint small">from </span>' : ''}${formatPrice(from)}</strong></span>
          ${!avail ? '<span class="status shut">Sold out</span>' : `<button class="btn ${vs.length ? 'line' : 'accent'} sm" data-id="${esc(d.id)}">${vs.length ? 'Choose' : 'Add'}</button>`}</div></li>`;
    }

    $('menu').addEventListener('click', e => {
      const b = e.target.closest('button[data-id]'); if (!b) return;
      const d = menu.find(m => m.id === b.dataset.id); if (!d) return;
      if (d.variants?.length) return openVariants(d);
      add(d, null);
    });

    function add(d, v) {
      cart.addItem({ shopId: shop.id, shopName: shop.name, itemId: d.id, variantId: v?.id || null, name: d.name, variantName: v?.name || null,
        price: v ? v.price : d.price, dietaryType: d.dietary_type, prepMinutes: v?.prep_time_minutes || d.prep_time_minutes });
    }

    function openVariants(d) {
      pending = d; $('vd-title').textContent = d.name;
      $('vd-opts').innerHTML = [{ id: '', name: 'Regular', price: d.price }, ...d.variants].map((v, i) => `
        <label class="choice"><span><input type="radio" name="v" value="${esc(v.id)}" ${i ? '' : 'checked'}>${esc(v.name)}</span><strong class="num">${formatPrice(v.price)}</strong></label>`).join('');
      $('vd').showModal();
    }
    $('vd-add').addEventListener('click', () => {
      const val = document.querySelector('input[name=v]:checked')?.value;
      add(pending, val ? pending.variants.find(x => x.id === val) : null);
    });

    async function loadReviews() {
      try {
        const rs = await api.getShopReviews(id);
        $('score').textContent = shop.rating_avg > 0 ? Number(shop.rating_avg).toFixed(1) : '—';
        $('rcount').textContent = rs.length ? `${rs.length} review${rs.length > 1 ? 's' : ''}` : '';
        $('reviews').innerHTML = rs.length ? rs.map(r => `<div class="rev"><strong class="num">${r.rating}★</strong> <span class="faint small">${esc(r.customer?.name || 'Diner')}</span>${r.comment ? `<p class="muted small" style="margin-top:4px">${esc(r.comment)}</p>` : ''}</div>`).join('')
          : `<p class="muted small">No reviews yet. Be the first after your order.</p>`;
      } catch { $('reviews').innerHTML = `<p class="muted small">Reviews could not be loaded.</p>`; }
    }

    $('write').addEventListener('click', () => auth.requireAuth() && $('rd').showModal());
    $('r-send').addEventListener('click', async () => {
      try {
        await api.createShopReview(id, { rating: Number($('rate').value), comment: $('rtext').value.trim() });
        toast.success('Review posted'); $('rtext').value = ''; loadReviews();
      } catch (err) { toast.error(err.message || 'Review could not be posted'); }
    });

    render(); loadReviews();
  </script>
</body>
</html>
