<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen desk — preorder</title>
<link rel="stylesheet" href="/css/system.css">
</head>
<body>
<div id="site-header"></div>
<main class="page"><div class="wrap">
  <div class="page-head">
    <div><h1 class="h1" id="title">Kitchen desk</h1>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><select class="input" id="shops" style="width:260px" aria-label="Kitchen"></select><button class="btn line" id="new-shop">Add kitchen</button><button class="btn accent" id="btn-add-dish">+ Add dish</button></div></div>
    <div class="panel" style="padding:14px 20px;display:flex;gap:24px;flex-wrap:wrap">
      <label class="sw"><input type="checkbox" id="is-open"><span id="l-open">Closed</span></label>
      <label class="sw"><input type="checkbox" id="is-acc"><span id="l-acc">Orders paused</span></label></div>
  </div>
  <div class="toolbar">
    <div class="tabs" id="tabs" role="tablist" style="border:0"><button role="tab" aria-selected="true" data-t="orders">Orders (<span id="active-n">0</span>)</button><button role="tab" aria-selected="false" data-t="menu">Menu</button></div>
    <div class="tabs" id="filters" style="border:0"><button aria-selected="true" data-s="">All</button><button aria-selected="false" data-s="pending">New</button><button aria-selected="false" data-s="accepted">Accepted</button><button aria-selected="false" data-s="preparing">Cooking</button><button aria-selected="false" data-s="ready">Ready</button><button aria-selected="false" data-s="completed">Done</button></div>
    <button class="btn accent" id="add-dish" hidden>Add dish</button>
  </div>
  <p class="hint" style="margin:-12px 0 20px" id="live">Orders refresh every 6 seconds.</p>
  <div class="board" id="board"></div>
  <div class="board" id="menu" hidden></div>
</div></main>

<dialog id="dd"><form method="dialog"><h2 class="h2" style="margin-bottom:18px">New dish</h2>
  <div class="field"><label for="d-n">Name</label><input class="input" id="d-n"></div>
  <div class="field"><label for="d-d">Description</label><textarea class="input" id="d-d"></textarea></div>
  <div class="grid2"><div class="field"><label for="d-p">Price (₹)</label><input class="input" id="d-p" type="number" step="0.5"></div><div class="field"><label for="d-t">Cook time (min)</label><input class="input" id="d-t" type="number" value="15" min="1" max="180"></div></div>
  <div class="grid2"><div class="field"><label for="d-c">Category</label><input class="input" id="d-c" placeholder="Mains, Bakery…"></div><div class="field"><label for="d-v">Diet</label><select class="input" id="d-v"><option value="veg">Vegetarian</option><option value="non_veg">Non-vegetarian</option><option value="vegan">Vegan</option></select></div></div>
  <div class="actions"><button class="btn quiet" value="x">Cancel</button><button class="btn accent" id="d-save" value="s">Save dish</button></div></form></dialog>
<dialog id="vd"><form method="dialog"><h2 class="h2" id="v-h" style="margin-bottom:18px">Add option</h2>
  <div class="field"><label for="v-n">Option name</label><input class="input" id="v-n" placeholder="Large, Extra cheese…"></div>
  <div class="grid2"><div class="field"><label for="v-p">Price (₹)</label><input class="input" id="v-p" type="number" step="0.5"></div><div class="field"><label for="v-t">Cook time (min)</label><input class="input" id="v-t" type="number" value="15" min="1" max="180"></div></div>
  <div class="actions"><button class="btn quiet" value="x">Cancel</button><button class="btn accent" id="v-save" value="s">Add option</button></div></form></dialog>
<dialog id="sd"><form method="dialog"><h2 class="h2" style="margin-bottom:18px">Add a kitchen</h2>
  <div class="field"><label for="s-n">Name</label><input class="input" id="s-n"></div>
  <div class="field"><label for="s-ph">Phone</label><input class="input" id="s-ph" type="tel" readonly style="background:var(--paper);cursor:not-allowed"><span class="hint" style="margin-top:4px">Automatically linked to your account phone number</span></div>
  <div class="field"><label for="s-d">Description</label><textarea class="input" id="s-d"></textarea></div>
  <div class="field"><label for="s-a">Address</label><input class="input" id="s-a"></div>
  <div class="grid3"><div class="field"><label for="s-c">City</label><input class="input" id="s-c"></div><div class="field"><label for="s-s">State</label><input class="input" id="s-s"></div><div class="field"><label for="s-z">Pincode</label><input class="input" id="s-z"></div></div>
  <div class="field"><label for="s-k">Category</label><input class="input" id="s-k" placeholder="Cafe, Bakery, Fast Food…"></div>
  <div class="actions"><button class="btn quiet" value="x">Cancel</button><button class="btn accent" id="s-save" value="s">Add kitchen</button></div></form></dialog>
<div id="site-footer"></div>
<script type="module">
import { api } from '/js/api.js'; import { auth } from '/js/auth.js'; import { toast } from '/js/toast.js'; import { esc, formatPrice, formatDate } from '/js/shell.js';
const $ = id => document.getElementById(id);
if (!auth.requireOwner()) throw 0;
let shops = [], shop = null, orders = [], menu = [], tab = 'orders', filt = '', dishFor = null, timer;
const NEXT = { pending: ['accepted', 'Accept order'], accepted: ['preparing', 'Start cooking'], preparing: ['ready', 'Mark ready'], ready: ['completed', 'Hand over'] };
const LABEL = { pending: 'New', accepted: 'Accepted', preparing: 'Cooking', ready: 'Ready', completed: 'Done', cancelled: 'Cancelled', cancel_requested: 'Cancel requested' };

async function fillOwnerPhone() {
  let u = auth.getUser();
  if (!u?.phone) {
    try { u = await api.getCurrentUser(); if (u) auth.setUser(u); } catch {}
  }
  if ($('s-ph')) $('s-ph').value = u?.phone || '';
}

async function init() {
  try {
    await fillOwnerPhone();
    shops = await api.getMyShops();
    if (!shops.length) { $('shops').innerHTML = '<option>No kitchens yet</option>'; $('title').textContent = 'Add your first kitchen'; $('sd').showModal(); return; }
    $('shops').innerHTML = shops.map(s => `<option value="${esc(s.id)}">${esc(s.name)} (${esc(s.city)})</option>`).join('');
    shop = shops[0]; switches(); load();
    clearInterval(timer); timer = setInterval(() => tab === 'orders' && shop && load(), 6000);
  } catch { toast.error('Your kitchens could not be loaded'); }
}
$('shops').addEventListener('change', e => { shop = shops.find(s => s.id === e.target.value); switches(); load(); });
function switches() {
  $('is-open').checked = !!shop.is_open; $('l-open').textContent = shop.is_open ? 'Open' : 'Closed';
  $('is-acc').checked = !!shop.is_accepting_orders; $('l-acc').textContent = shop.is_accepting_orders ? 'Taking orders' : 'Orders paused';
}
async function setStatus(open, acc, input, key) {
  try { const u = await api.updateShopStatus(shop.id, { is_open: open, is_accepting_orders: acc }); shop.is_open = u.is_open; shop.is_accepting_orders = u.is_accepting_orders; switches(); toast.success(key ? (u[key] ? 'Now on' : 'Now off') : 'Updated'); }
  catch (e) { input.checked = !input.checked; toast.error(e.message || 'Could not update status'); }
}
$('is-open').addEventListener('change', e => shop && setStatus(e.target.checked, shop.is_accepting_orders, e.target, 'is_open'));
$('is-acc').addEventListener('change', e => shop && setStatus(shop.is_open, e.target.checked, e.target, 'is_accepting_orders'));

async function load() {
  if (!shop) return;
  try { if (tab === 'orders') { orders = await api.getShopOrders(shop.id, { page: 1, page_size: 50 }); board(); } else { menu = await api.getMenuItems(shop.id); dishes(); } }
  catch { toast.error('Could not refresh'); }
}
function board() {
  $('active-n').textContent = orders.filter(o => ['pending', 'accepted', 'preparing', 'ready'].includes(o.status)).length;
  const rows = orders.filter(o => !filt || o.status === filt);
  $('board').innerHTML = rows.length ? rows.map(o => {
    const hold = o.status === 'cancel_requested' || o.is_cancellation_pending, n = NEXT[o.status];
    const num = o.order_number ? `#${o.order_number}` : `#${o.id.slice(0, 8).toUpperCase()}`;
    return `<article class="ticket ${hold ? 'hold' : o.status === 'completed' ? 'done' : ''}">
      <div style="display:flex;justify-content:space-between;gap:12px"><div><h3 class="h2">${esc(num)}</h3><div class="small muted">${formatDate(o.created_at)} · ${o.order_type === 'delivery' ? 'Delivery' : 'Counter'}</div></div><span class="status">${LABEL[o.status] || esc(o.status)}</span></div>
      <div class="small"><strong>${esc(o.customer?.name || 'Diner')}</strong> <span class="muted">${esc(o.customer?.phone || '')}</span></div>
      ${o.instructions ? `<div class="note"><strong>Note:</strong> ${esc(o.instructions)}</div>` : ''}
      <div>${(o.items || []).map(i => `<div class="kv"><dt><strong>${i.quantity}×</strong> ${esc(i.item_name_snapshot || i.item_name || 'Dish')}${(i.variant_name_snapshot || i.variant_name) ? ` <span class="muted">(${esc(i.variant_name_snapshot || i.variant_name)})</span>` : ''}</dt><dd class="num">${formatPrice(i.total_price || i.unit_price * i.quantity)}</dd></div>`).join('')}</div>
      <div class="totals"><span class="small muted">${esc((o.payment_method || 'cod').toUpperCase())} · ${esc(o.payment_status || 'unpaid')}</span><span class="num">${formatPrice(o.total_price || o.total_amount)}</span></div>
      ${hold ? `<div class="banner-note"><strong>Diner wants to cancel.</strong><br>${esc(o.cancellation_reason || 'No reason given.')}</div>
        <div class="acts"><button class="btn danger" data-a="cancel" data-id="${esc(o.id)}">Approve cancellation</button><button class="btn line" data-a="resume" data-id="${esc(o.id)}">Keep cooking</button></div>`
      : n ? `<div class="acts"><button class="btn accent" data-a="go" data-to="${n[0]}" data-id="${esc(o.id)}">${n[1]}</button>
        ${o.status === 'pending' ? `<button class="btn danger" data-a="go" data-to="cancelled" data-id="${esc(o.id)}">Decline</button>` : ''}
        ${o.status === 'ready' && o.payment_status !== 'paid' ? `<button class="btn line" data-a="paid" data-id="${esc(o.id)}">Cash collected</button>` : ''}</div>` : ''}
    </article>`; }).join('') : `<p class="empty" style="grid-column:1/-1">No orders in this view.</p>`;
}
$('board').addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const { a, id, to } = b.dataset;
  try {
    if (a === 'go') { if (to === 'completed') { try { await api.updateOrderStatus(id, { status: 'mark_as_paid' }); } catch {} } await api.updateOrderStatus(id, { status: to }); toast.success(`Order ${LABEL[to].toLowerCase()}`); }
    if (a === 'paid') { await api.updateOrderStatus(id, { status: 'mark_as_paid' }); toast.success('Payment recorded'); }
    if (a === 'cancel') { await api.updateOrderStatus(id, { status: 'cancelled', reason: 'Owner approved diner cancellation' }); toast.success('Order cancelled'); }
    if (a === 'resume') { await api.updateOrderStatus(id, { status: 'resume_order' }); toast.success('Order resumed'); }
    load();
  } catch (err) { toast.error(err.message || 'That change could not be made'); }
});

function dishes() {
  $('menu').innerHTML = menu.length ? menu.map(d => { const av = d.is_available !== false; return `<article class="ticket" style="border-top-color:${av ? 'var(--leaf)' : 'var(--chili)'}">
    <div style="display:flex;justify-content:space-between;gap:12px"><div><span class="diet ${esc(d.dietary_type || 'veg')}"></span> <h3 class="h3" style="display:inline">${esc(d.name)}</h3></div><strong class="num">${formatPrice(d.price)}</strong></div>
    <p class="small muted">${esc(d.description || 'No description.')}</p>
    ${(d.variants || []).length ? `<div>${d.variants.map(v => `<div class="kv"><dt>${esc(v.name)}</dt><dd class="num">${formatPrice(v.price)}</dd></div>`).join('')}</div>` : ''}
    <div class="acts"><button class="btn line sm" data-m="stock" data-id="${esc(d.id)}" data-av="${av}">${av ? 'Mark sold out' : 'Back in stock'}</button><button class="btn quiet sm" data-m="var" data-id="${esc(d.id)}" data-name="${esc(d.name)}">Add option</button><button class="btn danger sm" data-m="del" data-id="${esc(d.id)}">Delete</button></div></article>`; }).join('')
    : `<div class="panel empty" style="grid-column:1/-1;text-align:center;padding:48px 24px">
        <h3 class="h2" style="margin-bottom:8px">No dishes yet</h3>
        <p class="muted" style="margin-bottom:20px">Add dishes to your menu so diners can start ordering.</p>
        <button class="btn accent" data-m="add-first">+ Add first dish</button>
       </div>`;
}
$('menu').addEventListener('click', async e => {
  const b = e.target.closest('button[data-m]'); if (!b) return; const { m, id } = b.dataset;
  if (m === 'add-first') return openAddDish();
  try {
    if (m === 'stock') { await api.updateMenuItem(id, { is_available: b.dataset.av !== 'true' }); toast.success('Stock updated'); }
    if (m === 'del') { if (!confirm('Delete this dish? This cannot be undone.')) return; await api.deleteMenuItem(id); toast.success('Dish deleted'); }
    if (m === 'var') { dishFor = id; $('v-h').textContent = `Add option to ${b.dataset.name}`; return $('vd').showModal(); }
    load();
  } catch (err) { toast.error(err.message || 'That change could not be made'); }
});

function openAddDish() {
  if (!shop) return toast.error('Please add or select a kitchen first');
  $('d-n').value = '';
  $('d-d').value = '';
  $('d-p').value = '';
  $('d-t').value = '15';
  $('d-c').value = '';
  $('d-v').value = 'veg';
  $('dd').showModal();
}

$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; tab = b.dataset.t;
  document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  const o = tab === 'orders'; $('board').hidden = !o; $('menu').hidden = o; $('filters').hidden = !o; $('add-dish').hidden = o; $('live').hidden = !o; load();
});
$('filters').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-selected', x === b)); filt = b.dataset.s; board(); });
$('btn-add-dish').addEventListener('click', openAddDish);
$('add-dish').addEventListener('click', openAddDish);
$('new-shop').addEventListener('click', async () => { await fillOwnerPhone(); $('sd').showModal(); });

const guard = (e, ok, msg) => { if (!ok) { e.preventDefault(); toast.error(msg); } return ok; };
$('d-save').addEventListener('click', async e => {
  const name = $('d-n').value.trim(), price = Number($('d-p').value);
  if (!guard(e, name && price > 0, 'Add a name and a price above zero')) return;
  try {
    await api.createMenuItem(shop.id, { name, description: $('d-d').value.trim() || null, price, prep_time_minutes: Number($('d-t').value), category: $('d-c').value.trim() || null, dietary_type: $('d-v').value });
    toast.success(`${name} added`);
    if (tab !== 'menu') {
      tab = 'menu';
      document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x.dataset.t === 'menu'));
      $('board').hidden = true; $('menu').hidden = false; $('filters').hidden = true; $('add-dish').hidden = false; $('live').hidden = true;
    }
    load();
  }
  catch (err) { toast.error(err.message || 'Dish could not be added'); }
});
$('v-save').addEventListener('click', async e => {
  const name = $('v-n').value.trim(), price = Number($('v-p').value);
  if (!guard(e, name && price > 0, 'Add an option name and a price above zero')) return;
  try { await api.createVariant(dishFor, { name, price, prep_time_minutes: Number($('v-t').value) }); toast.success('Option added'); load(); }
  catch (err) { toast.error(err.message || 'Option could not be added'); }
});
$('s-save').addEventListener('click', async e => {
  const v = k => $(k).value.trim(), city = v('s-c');
  const user = auth.getUser();
  const phone = user?.phone || v('s-ph');
  if (!guard(e, v('s-n') && phone && v('s-a') && city && v('s-z'), 'Fill in name, address, city and pincode')) return;
  try { const c = await api.createShop({ name: v('s-n'), phone, description: v('s-d') || null, address_line: v('s-a'), city, state: v('s-s') || city, pincode: v('s-z'), category: v('s-k') || 'Gourmet' }); toast.success(`${c.name} added`); init(); }
  catch (err) { toast.error(err.message || 'Kitchen could not be added'); }
});
init();
</script></body></html>
