<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — PREORDER</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
  <!-- Global Architectural Header -->
  <div id="global-header"></div>

  <main class="app-container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px var(--container-padding);">
    <div style="width: 100%; max-width: 440px; border: 1px solid var(--border-medium); background: var(--bg-surface); border-radius: var(--radius-sm); padding: 40px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);">
      <div style="margin-bottom: 28px;">
        <div class="eyebrow">IDENTITY VERIFICATION</div>
        <h1 class="headline-2" style="margin-top: 4px;">Access PreOrder</h1>
        <p class="subheadline" style="font-size: 0.85rem; margin-top: 6px;">Sign in to manage active tickets, track orders, or access your kitchen control desk.</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-phone">TELEPHONE NUMBER</label>
          <input type="tel" id="login-phone" class="input-text" placeholder="+919876543210" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">AUTHENTICATION SECRET</label>
          <input type="password" id="login-password" class="input-text" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <div style="margin-top: 24px;">
          <button type="submit" class="btn btn-primary btn-lg" id="submit-login-btn" style="width: 100%;">
            SIGN IN TO NETWORK &rarr;
          </button>
        </div>
      </form>

      <div class="hairline-divider" style="margin: 28px 0 20px;"></div>

      <div style="display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 0.76rem;">
        <span style="color: var(--text-tertiary);">NEW OPERATOR OR DINER?</span>
        <a href="/register.html" style="color: var(--accent-ember-hover); text-decoration: none; font-weight: 600;">CREATE ACCOUNT &rarr;</a>
      </div>

      <!-- Developer Credentials Hint -->
      <div style="margin-top: 24px; padding: 12px; background: var(--bg-surface-elevated); border: 1px dashed var(--border-subtle); border-radius: var(--radius-xs);">
        <div class="mono-meta" style="font-size: 0.68rem; color: var(--text-tertiary);">[ LOCAL DEV SEED HINT ]</div>
        <div class="mono-meta" style="font-size: 0.72rem; color: var(--text-secondary); margin-top: 4px;">
          Customer: <code>+919876543210</code> / <code>Password123!</code><br>
          Owner: <code>+919876543211</code> / <code>Password123!</code>
        </div>
      </div>
    </div>
  </main>

  <!-- Global Footer -->
  <div id="global-footer"></div>

  <!-- Scripts -->
  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { toast } from '/js/toast.js';

    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || '/index.html';

    // If already logged in, redirect
    if (auth.isLoggedIn()) {
      window.location.href = redirectUrl;
    }

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'AUTHENTICATING TOKEN...';

      const phone = document.getElementById('login-phone').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const { user } = await api.login(phone, password);
        toast.success(`Welcome back, ${user.name || 'Operator'}`);

        setTimeout(() => {
          if (user.role === 'shop_owner' && redirectUrl === '/index.html') {
            window.location.href = '/owner.html';
          } else {
            window.location.href = redirectUrl;
          }
        }, 500);
      } catch (err) {
        toast.error(err.message || 'Authentication credentials rejected');
        submitBtn.disabled = false;
        submitBtn.textContent = 'SIGN IN TO NETWORK →';
      }
    });
  </script>
</body>
</html>
