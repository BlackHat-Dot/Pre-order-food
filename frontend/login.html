<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — preorder</title>
<link rel="stylesheet" href="/css/system.css">
</head>
<body>
<div id="site-header"></div>
<main class="auth"><div class="panel">
  <h1 class="h1">Log in</h1>
  <p class="muted" style="margin-bottom:24px">Track your orders or open your kitchen desk.</p>
  <form id="f">
    <div class="field"><label for="phone">Phone number</label><input class="input" id="phone" type="tel" placeholder="+919876543210" required autocomplete="username"></div>
    <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" required autocomplete="current-password"></div>
    <button class="btn accent lg" id="go" style="width:100%;margin-top:8px">Log in</button>
  </form>
  <hr class="rule" style="margin:24px 0 16px">
  <p class="small muted">New here? <a href="/register.html"><strong>Create an account</strong></a></p>
  <p class="hint" style="margin-top:14px">Local dev: +919876543210 or +919876543211, password Password123!</p>
</div></main>
<div id="site-footer"></div>
<script type="module">
import { api } from '/js/api.js'; import { auth } from '/js/auth.js'; import { toast } from '/js/toast.js'; import '/js/shell.js';
const redirect = new URLSearchParams(location.search).get('redirect') || '/index.html';
if (auth.isLoggedIn()) location.href = redirect;
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('go'); b.disabled = true; b.textContent = 'Logging in…';
  try {
    const { user } = await api.login(phone.value.trim(), pw.value);
    toast.success(`Welcome back, ${(user.name || '').split(' ')[0] || 'there'}`);
    setTimeout(() => location.href = (user.role === 'shop_owner' && redirect === '/index.html') ? '/owner.html' : redirect, 400);
  } catch (err) { toast.error(err.message || 'Phone or password is incorrect'); b.disabled = false; b.textContent = 'Log in'; }
});
</script></body></html>
